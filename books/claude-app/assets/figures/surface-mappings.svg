<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" role="img" aria-labelledby="title"><title id="title">CDS 浅色与深色表面令牌对照</title><style>text{font-family:system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1160" height="630" rx="0" fill="#eeede8" stroke="none"/><text x="40" y="48" fill="#20201f" font-size="26" font-weight="650">表面层级：同一角色，两套主题映射</text><text x="40" y="80" fill="#52514e" font-size="15" font-weight="400">官方 Linux 包 2.37337.1 中选定 CDS 声明的解析值；非运行时截图</text><rect x="40" y="110" width="530" height="440" rx="20" fill="#f9f9f7" stroke="none"/><text x="64" y="148" fill="#0b0b0b" font-size="21" font-weight="600">浅色语义配置</text><rect x="64" y="174" width="482" height="61" rx="10" fill="#f9f9f7" stroke="#97958c"/><text x="80" y="199" fill="#0b0b0b" font-size="15" font-weight="500">--cds-surface-0</text><text x="80" y="222" fill="#52514e" font-size="14" font-weight="400">#f9f9f7</text><rect x="64" y="251" width="482" height="61" rx="10" fill="#fcfcfb" stroke="#97958c"/><text x="80" y="276" fill="#0b0b0b" font-size="15" font-weight="500">--cds-surface-1</text><text x="80" y="299" fill="#52514e" font-size="14" font-weight="400">#fcfcfb</text><rect x="64" y="328" width="482" height="61" rx="10" fill="#ffffff" stroke="#97958c"/><text x="80" y="353" fill="#0b0b0b" font-size="15" font-weight="500">--cds-surface-2</text><text x="80" y="376" fill="#52514e" font-size="14" font-weight="400">#ffffff</text><rect x="64" y="405" width="482" height="61" rx="10" fill="#ffffff" stroke="#97958c"/><text x="80" y="430" fill="#0b0b0b" font-size="15" font-weight="500">--cds-surface-3</text><text x="80" y="453" fill="#52514e" font-size="14" font-weight="400">#ffffff</text><text x="64" y="522" fill="#52514e" font-size="14" font-weight="400">同色不等于同层：浮层还依赖边界、阴影与位置。</text><rect x="590" y="110" width="530" height="440" rx="20" fill="#0b0b0b" stroke="none"/><text x="614" y="148" fill="#f0efec" font-size="21" font-weight="600">深色语义配置</text><rect x="614" y="174" width="482" height="61" rx="10" fill="#0b0b0b" stroke="#52514e"/><text x="630" y="199" fill="#f0efec" font-size="15" font-weight="500">--cds-surface-0</text><text x="630" y="222" fill="#c3c2b7" font-size="14" font-weight="400">#0b0b0b</text><rect x="614" y="251" width="482" height="61" rx="10" fill="#151515" stroke="#52514e"/><text x="630" y="276" fill="#f0efec" font-size="15" font-weight="500">--cds-surface-1</text><text x="630" y="299" fill="#c3c2b7" font-size="14" font-weight="400">#151515</text><rect x="614" y="328" width="482" height="61" rx="10" fill="#1a1a19" stroke="#52514e"/><text x="630" y="353" fill="#f0efec" font-size="15" font-weight="500">--cds-surface-2</text><text x="630" y="376" fill="#c3c2b7" font-size="14" font-weight="400">#1a1a19</text><rect x="614" y="405" width="482" height="61" rx="10" fill="#20201f" stroke="#52514e"/><text x="630" y="430" fill="#f0efec" font-size="15" font-weight="500">--cds-surface-3</text><text x="630" y="453" fill="#c3c2b7" font-size="14" font-weight="400">#20201f</text><text x="614" y="522" fill="#c3c2b7" font-size="14" font-weight="400">同色不等于同层：浮层还依赖边界、阴影与位置。</text><text x="40" y="589" fill="#20201f" font-size="15" font-weight="400">本图是原创示意。值的出处、选择器和字节位置见 data/design-token-summary.json。</text><text x="40" y="613" fill="#20201f" font-size="15" font-weight="400">不要把这里的 surface-0 自动等同于旧版 bg-100，或套到全部桌面窗口。</text></svg>