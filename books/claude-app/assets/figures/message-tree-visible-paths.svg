<text x="307.5" y="1015" font-size="21" fill="#67645c" font-weight="600" text-anchor="middle">H2</text>
<path d="M360 1008L405 1008" fill="none" stroke="#d9d5cb" stroke-width="2" stroke-linecap="round"/>
<rect x="405" y="986" width="105" height="44" rx="9" fill="#eeeae1"/>
<text x="457.5" y="1015" font-size="21" fill="#67645c" font-weight="600" text-anchor="middle">A2</text>
<text x="530" y="1015" font-size="18" fill="#67645c" font-weight="400" text-anchor="start">保留</text>
<path d="M190 1042 H224 V1083 H255" fill="none" stroke="#a65539" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="255" y="1061" width="105" height="44" rx="9" fill="#f2e2d7"/>
<text x="307.5" y="1090" font-size="21" fill="#a65539" font-weight="600" text-anchor="middle">H2b</text>
<path d="M360 1083L405 1083" fill="none" stroke="#a65539" stroke-width="3" stroke-linecap="round"/>
<rect x="405" y="1061" width="105" height="44" rx="9" fill="#f2e2d7"/>
<text x="457.5" y="1090" font-size="21" fill="#a65539" font-weight="600" text-anchor="middle">A2b</text>
<text x="530" y="1090" font-size="18" fill="#a65539" font-weight="400" text-anchor="start">新增</text>
<text x="90" y="1134" font-size="18" fill="#67645c" font-weight="400" text-anchor="start" class="mono">H2b.parent = H2.parent = A1</text>
<rect x="770" y="1020" width="100" height="44" rx="9" fill="#eeeae1"/>
<text x="820.0" y="1049" font-size="21" fill="#67645c" font-weight="600" text-anchor="middle">H1</text>
<path d="M870 1042 H915 V1008 H960" fill="none" stroke="#d9d5cb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="960" y="986" width="110" height="44" rx="9" fill="#eeeae1"/>
<text x="1015.0" y="1015" font-size="21" fill="#67645c" font-weight="600" text-anchor="middle">A1</text>
<text x="1100" y="1015" font-size="18" fill="#67645c" font-weight="400" text-anchor="start">保留原回复及后代</text>
<path d="M870 1042 H915 V1083 H960" fill="none" stroke="#466957" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="960" y="1061" width="110" height="44" rx="9" fill="#e7ece7"/>
<text x="1015.0" y="1090" font-size="21" fill="#466957" font-weight="600" text-anchor="middle">A1b</text>
<text x="1100" y="1090" font-size="18" fill="#466957" font-weight="400" text-anchor="start">新增回复版本</text>
<text x="770" y="1134" font-size="18" fill="#67645c" font-weight="400" text-anchor="start" class="mono">A1b.parent = A1.parent = H1</text>
<text x="60" y="1202" font-size="19" fill="#67645c" font-weight="400" text-anchor="start">连线表示 parent → child；同一节点只有一个 parent。切换分支只改变选中路径，不必新增或删除节点。</text>
</svg>