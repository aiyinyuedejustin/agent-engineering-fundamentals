<rect x="314.0" y="294" width="122" height="46" rx="10" fill="#a65539"/>
<text x="375" y="325" font-size="23" fill="#fcfcfa" font-weight="650" text-anchor="middle">Root</text>
<rect x="322.0" y="376" width="106" height="46" rx="10" fill="#a65539"/>
<text x="375" y="407" font-size="23" fill="#fcfcfa" font-weight="650" text-anchor="middle">H1</text>
<rect x="217.0" y="470" width="106" height="46" rx="10" fill="#a65539"/>
<text x="270" y="501" font-size="23" fill="#fcfcfa" font-weight="650" text-anchor="middle">A1</text>
