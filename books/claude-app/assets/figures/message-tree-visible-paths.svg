<text x="555" y="501" font-size="23" fill="#67645c" font-weight="400" text-anchor="middle">A1b</text>
<rect x="122.0" y="572" width="106" height="46" rx="10" fill="#eeeae1"/>
<text x="175" y="603" font-size="23" fill="#67645c" font-weight="400" text-anchor="middle">H2</text>
<rect x="322.0" y="572" width="106" height="46" rx="10" fill="#a65539"/>
<text x="375" y="603" font-size="23" fill="#fcfcfa" font-weight="650" text-anchor="middle">H2b</text>
<rect x="502.0" y="572" width="106" height="46" rx="10" fill="#eeeae1"/>
<text x="555" y="603" font-size="23" fill="#67645c" font-weight="400" text-anchor="middle">H3</text>
<rect x="122.0" y="674" width="106" height="46" rx="10" fill="#eeeae1"/>
<text x="175" y="705" font-size="23" fill="#67645c" font-weight="400" text-anchor="middle">A2</text>
<rect x="322.0" y="674" width="106" height="46" rx="10" fill="#a65539"/>
<text x="375" y="705" font-size="23" fill="#fcfcfa" font-weight="650" text-anchor="middle">A2b</text>
<rect x="85" y="747" width="590" height="64" rx="10" fill="#f2e2d7"/>
<text x="103" y="771" font-size="17" fill="#67645c" font-weight="400" text-anchor="start">可见 transcript（不含 Root）</text>
<text x="103" y="800" font-size="24" fill="#a65539" font-weight="600" text-anchor="start">H1 → A1 → H2b → A2b</text>
<rect x="740" y="181" width="640" height="655" rx="16" fill="#fcfcfa" stroke="#d9d5cb" stroke-width="1.5"/>
<text x="765" y="221" font-size="23" fill="#466957" font-weight="650" text-anchor="start">B · 选择重试分支中的 H3</text>
<text x="765" y="254" font-size="18" fill="#67645c" font-weight="400" text-anchor="start">A1b 与 A1 是 H1 下的 assistant 兄弟</text>
