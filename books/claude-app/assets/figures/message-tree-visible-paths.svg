<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1250" viewBox="0 0 1440 1250" role="img" aria-labelledby="title desc">
<title id="title">同一棵消息树上的编辑分支与重试分支</title><desc id="desc">左右绘制相同消息树。左边选中 Root H1 A1 H2b A2b，右边选中 Root H1 A1b H3。下方分别显示对应 transcript。编辑 human 在原父节点下新建 human 兄弟及 assistant，重试 assistant 在同一 human 下新建 assistant 兄弟，旧分支均保留。</desc>
<style>text{font-family:"Noto Sans CJK SC",system-ui,sans-serif} .mono{font-family:"DejaVu Sans Mono","Noto Sans CJK SC",monospace}</style>
<defs><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#67645c"/></marker><marker id="arrow-rust" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a65539"/></marker><marker id="arrow-sage" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#466957"/></marker></defs>
<rect x="0" y="0" width="1440" height="1250" rx="0" fill="#f5f3ec"/>
<text x="60" y="56" font-size="18" fill="#a65539" font-weight="600" text-anchor="start">卷 08 · CONVERSATION TREE / 原创学习图</text>
<text x="60" y="110" font-size="37" fill="#25231e" font-weight="700" text-anchor="start">一棵消息树，两条可见历史</text>
<text x="60" y="148" font-size="21" fill="#67645c" font-weight="400" text-anchor="start">编辑与重试会增加兄弟节点；显示哪条历史，由各层选中的子节点共同决定。</text>
<rect x="60" y="181" width="640" height="655" rx="16" fill="#fcfcfa" stroke="#d9d5cb" stroke-width="1.5"/>
<text x="85" y="221" font-size="23" fill="#a65539" font-weight="650" text-anchor="start">A · 选择编辑分支的叶子 A2b</text>
<text x="85" y="254" font-size="18" fill="#67645c" font-weight="400" text-anchor="start">H2b 与 H2 是 A1 下的 human 兄弟</text>
