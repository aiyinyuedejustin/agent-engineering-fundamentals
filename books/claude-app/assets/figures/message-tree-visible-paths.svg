<text x="1055" y="325" font-size="23" fill="#fcfcfa" font-weight="650" text-anchor="middle">Root</text>
<rect x="1002.0" y="376" width="106" height="46" rx="10" fill="#466957"/>
<text x="1055" y="407" font-size="23" fill="#fcfcfa" font-weight="650" text-anchor="middle">H1</text>
<rect x="897.0" y="470" width="106" height="46" rx="10" fill="#eeeae1"/>
<text x="950" y="501" font-size="23" fill="#67645c" font-weight="400" text-anchor="middle">A1</text>
<rect x="1182.0" y="470" width="106" height="46" rx="10" fill="#466957"/>
<text x="1235" y="501" font-size="23" fill="#fcfcfa" font-weight="650" text-anchor="middle">A1b</text>
<rect x="802.0" y="572" width="106" height="46" rx="10" fill="#eeeae1"/>
<text x="855" y="603" font-size="23" fill="#67645c" font-weight="400" text-anchor="middle">H2</text>
<rect x="1002.0" y="572" width="106" height="46" rx="10" fill="#eeeae1"/>
<text x="1055" y="603" font-size="23" fill="#67645c" font-weight="400" text-anchor="middle">H2b</text>
<rect x="1182.0" y="572" width="106" height="46" rx="10" fill="#466957"/>
<text x="1235" y="603" font-size="23" fill="#fcfcfa" font-weight="650" text-anchor="middle">H3</text>
<rect x="802.0" y="674" width="106" height="46" rx="10" fill="#eeeae1"/>
<text x="855" y="705" font-size="23" fill="#67645c" font-weight="400" text-anchor="middle">A2</text>
<rect x="1002.0" y="674" width="106" height="46" rx="10" fill="#eeeae1"/>
<text x="1055" y="705" font-size="23" fill="#67645c" font-weight="400" text-anchor="middle">A2b</text>
<rect x="765" y="747" width="590" height="64" rx="10" fill="#e7ece7"/>
<text x="783" y="771" font-size="17" fill="#67645c" font-weight="400" text-anchor="start">可见 transcript（不含 Root）</text>
<text x="783" y="800" font-size="24" fill="#466957" font-weight="600" text-anchor="start">H1 → A1b → H3</text>
<path d="M85 869L130 869" fill="none" stroke="#a65539" stroke-width="5" stroke-linecap="round"/>
<text x="144" y="877" font-size="19" fill="#67645c" font-weight="400" text-anchor="start">粗线 + 实心节点：选中路径</text>
<path d="M535 869L580 869" fill="none" stroke="#d9d5cb" stroke-width="2" stroke-linecap="round"/>
<text x="594" y="877" font-size="19" fill="#67645c" font-weight="400" text-anchor="start">浅线 + 浅底节点：保留的其他分支</text>
<text x="1375" y="877" font-size="18" fill="#67645c" font-weight="400" text-anchor="end">H = human；A = assistant</text>
<rect x="60" y="912" width="640" height="244" rx="16" fill="#fcfcfa" stroke="#d9d5cb" stroke-width="1.5"/>
<text x="85" y="951" font-size="22" fill="#25231e" font-weight="650" text-anchor="start">编辑 human：复用原 parent，新增 H + A</text>
<rect x="740" y="912" width="640" height="244" rx="16" fill="#fcfcfa" stroke="#d9d5cb" stroke-width="1.5"/>
<text x="765" y="951" font-size="22" fill="#25231e" font-weight="650" text-anchor="start">重试 assistant：同一 H 下新增 A</text>
<rect x="90" y="1020" width="100" height="44" rx="9" fill="#eeeae1"/>
<text x="140.0" y="1049" font-size="21" fill="#67645c" font-weight="600" text-anchor="middle">A1</text>
<path d="M190 1042 H224 V1008 H255" fill="none" stroke="#d9d5cb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
