<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">审批与具体执行计划绑定</title><desc id="desc">原创时序图。参数变化、撤销、过期和资源变化使旧授权不能继续执行。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#5b625d"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f7f4ee"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#252b27"><text x="42" y="56" font-size="30" fill="#252b27" font-weight="700">Allow 应绑定到一个具体计划</text><text x="42" y="88" font-size="18" fill="#69716b" font-weight="400">A · 原创时序：确认被消费，与副作用完成是两个不同事件</text><rect x="32" y="125" width="206" height="52" rx="12" fill="#e5ede8"/><text x="52" y="159" font-size="21" fill="#252b27" font-weight="700">计划生成</text><path d="M135,184 V620" stroke="#c7cdc6" stroke-width="2" stroke-dasharray="5 6"/><rect x="327" y="125" width="206" height="52" rx="12" fill="#e5ede8"/><text x="347" y="159" font-size="21" fill="#252b27" font-weight="700">可信审批入口</text><path d="M430,184 V620" stroke="#c7cdc6" stroke-width="2" stroke-dasharray="5 6"/><rect x="632" y="125" width="206" height="52" rx="12" fill="#e5ede8"/><text x="652" y="159" font-size="21" fill="#252b27" font-weight="700">票据仓库</text><path d="M735,184 V620" stroke="#c7cdc6" stroke-width="2" stroke-dasharray="5 6"/><rect x="957" y="125" width="206" height="52" rx="12" fill="#e5ede8"/><text x="977" y="159" font-size="21" fill="#252b27" font-weight="700">资源执行器</text><path d="M1060,184 V620" stroke="#c7cdc6" stroke-width="2" stroke-dasharray="5 6"/><path d="M135,225 L430,225" stroke="#5b625d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="175" y="211" font-size="17" fill="#252b27" font-weight="400">展示完整计划</text><path d="M430,290 L735,290" stroke="#5b625d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="461" y="275" font-size="17" fill="#252b27" font-weight="400">确认 + 上下文 + 期限</text><path d="M735,355 L430,355" stroke="#5b625d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="478" y="341" font-size="17" fill="#252b27" font-weight="400">一次性 opaque ticket</text><path d="M430,420 L1060,420" stroke="#5b625d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="570" y="405" font-size="17" fill="#252b27" font-weight="400">票据 + 相同计划</text><path d="M1060,482 L735,482" stroke="#5b625d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="780" y="468" font-size="17" fill="#252b27" font-weight="400">精确校验并消费</text><path d="M735,533 L1060,533" stroke="#5b625d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="785" y="519" font-size="17" fill="#252b27" font-weight="400">当前批准有效</text><rect x="925" y="560" width="232" height="62" rx="12" fill="#f4e4d8"/><text x="940" y="586" font-size="17" fill="#252b27" font-weight="700">再次核对资源身份</text><text x="940" y="610" font-size="16" fill="#252b27" font-weight="400">然后才进入实际操作</text><text x="42" y="666" font-size="19" fill="#8b4e3b" font-weight="400">参数改变 / policy revision 改变 / generation 改变 / 过期 / 取消 / 重放 → 拒绝旧票据</text><text x="42" y="697" font-size="16" fill="#69716b" font-weight="400">模型为纯内存教学；真实系统还需要可信调用者认证与 OS / 服务侧原子操作。</text></g></svg>