<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="976" viewBox="0 0 1360 976" role="img" aria-labelledby="title desc"><title id="title">乐观身份替换的完整树状态与发布边界</title><desc id="desc">前后两棵树保留相同兄弟位置，四张索引以及叶子和悬空集合共同对账。候选准备失败不修改旧树，成功后一次发布。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58646c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a43a3a"/></marker></defs><rect x="0" y="0" width="1360" height="976" rx="0" fill="#faf8f3" stroke="#faf8f3"/><text x="42" y="53" font-size="31" fill="#242c32" font-weight="700">身份替换：所有索引一起跨过发布点</text><text x="42" y="88" font-size="18" fill="#58646c" font-weight="400">原创教学案例｜直接复用 ConversationBranches；不代表目标产品的 rekey 实现</text><rect x="42" y="116" width="598" height="356" rx="14" fill="#ffffff" stroke="#d8ddd9"/><text x="64" y="152" font-size="23" fill="#b75a2d" font-weight="650">已发布树：乐观身份</text><text x="64" y="184" font-size="17" fill="#58646c" font-weight="400">共同祖先 ROOT → h0 → a0</text><rect x="264" y="205" width="148" height="44" rx="10" fill="#f1f4f3" stroke="#d8ddd9"/><text x="280" y="234" font-size="18" fill="#242c32" font-weight="600">a0</text><path d="M338 249V268H157V290" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><path d="M338 249V268H467V290" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="291" width="166" height="44" rx="10" fill="#f1f4f3" stroke="#d8ddd9"/><text x="90" y="320" font-size="18" fill="#242c32" font-weight="600">h-old</text><rect x="384" y="291" width="210" height="44" rx="10" fill="#fff0e6" stroke="#b75a2d"/><text x="400" y="320" font-size="18" fill="#b75a2d" font-weight="600">opt:h1</text><path d="M157 335V365" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><path d="M489 335V365" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><rect x="74" y="366" width="166" height="44" rx="10" fill="#f1f4f3" stroke="#d8ddd9"/><text x="90" y="395" font-size="18" fill="#242c32" font-weight="600">a-old</text><rect x="384" y="366" width="210" height="44" rx="10" fill="#fff0e6" stroke="#b75a2d"/><text x="400" y="395" font-size="18" fill="#b75a2d" font-weight="600">opt:a1</text><text x="74" y="444" font-size="16" fill="#58646c" font-weight="400">兄弟位置 0：保留</text><text x="384" y="444" font-size="16" fill="#b75a2d" font-weight="400">兄弟位置 1：仍选中</text><rect x="720" y="116" width="598" height="356" rx="14" fill="#ffffff" stroke="#d8ddd9"/><text x="742" y="152" font-size="23" fill="#227260" font-weight="650">候选树：正式身份</text><text x="742" y="184" font-size="17" fill="#58646c" font-weight="400">共同祖先 ROOT → h0 → a0</text><rect x="942" y="205" width="148" height="44" rx="10" fill="#f1f4f3" stroke="#d8ddd9"/><text x="958" y="234" font-size="18" fill="#242c32" font-weight="600">a0</text><path d="M1016 249V268H835V290" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1016 249V268H1145V290" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><rect x="752" y="291" width="166" height="44" rx="10" fill="#f1f4f3" stroke="#d8ddd9"/><text x="768" y="320" font-size="18" fill="#242c32" font-weight="600">h-old</text><rect x="1062" y="291" width="210" height="44" rx="10" fill="#fff0e6" stroke="#b75a2d"/><text x="1078" y="320" font-size="18" fill="#b75a2d" font-weight="600">h1</text><path d="M835 335V365" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1167 335V365" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><rect x="752" y="366" width="166" height="44" rx="10" fill="#f1f4f3" stroke="#d8ddd9"/><text x="768" y="395" font-size="18" fill="#242c32" font-weight="600">a-old</text><rect x="1062" y="366" width="210" height="44" rx="10" fill="#fff0e6" stroke="#b75a2d"/><text x="1078" y="395" font-size="18" fill="#b75a2d" font-weight="600">a1</text><text x="752" y="444" font-size="16" fill="#58646c" font-weight="400">兄弟位置 0：保留</text><text x="1062" y="444" font-size="16" fill="#b75a2d" font-weight="400">兄弟位置 1：仍选中</text><path d="M651 296H705" fill="none" stroke="#227260" stroke-width="3" marker-end="url(#arrow)"/><text x="655" y="278" font-size="15" fill="#227260" font-weight="400">准备</text><text x="42" y="512" font-size="24" fill="#242c32" font-weight="650">必须同步的状态</text><text x="42" y="541" font-size="17" fill="#58646c" font-weight="400">原始内容不变；身份、父边、子边与 leaf 共同对账。</text><rect x="42" y="562" width="1276" height="45" rx="7" fill="#ffffff" stroke="#d8ddd9"/><text x="58" y="592" font-size="17" fill="#316a8e" font-weight="600">messageByUuid</text><text x="350" y="592" font-size="18" fill="#242c32" font-weight="400">opt:h1 / opt:a1 → h1 / a1；对象内部身份和 parent 同步</text><rect x="42" y="613" width="1276" height="45" rx="7" fill="#f0f3ef" stroke="#d8ddd9"/><text x="58" y="643" font-size="17" fill="#316a8e" font-weight="600">parentByChildUuid</text><text x="350" y="643" font-size="18" fill="#242c32" font-weight="400">opt:a1 → opt:h1  改为  a1 → h1</text><rect x="42" y="664" width="1276" height="45" rx="7" fill="#ffffff" stroke="#d8ddd9"/><text x="58" y="694" font-size="17" fill="#316a8e" font-weight="600">childrenByParentUuid</text><text x="350" y="694" font-size="18" fill="#242c32" font-weight="400">a0: [h-old, opt:h1] → [h-old, h1]；h1: [a1]</text><rect x="42" y="715" width="1276" height="45" rx="7" fill="#f0f3ef" stroke="#d8ddd9"/><text x="58" y="745" font-size="17" fill="#316a8e" font-weight="600">selectedChildByUuid</text><text x="350" y="745" font-size="18" fill="#242c32" font-weight="400">opt:h1: 0 → h1: 0；a0: 1 保持不变</text><rect x="42" y="766" width="1276" height="45" rx="7" fill="#ffffff" stroke="#d8ddd9"/><text x="58" y="796" font-size="17" fill="#316a8e" font-weight="600">currentLeaf / dangling</text><text x="350" y="796" font-size="18" fill="#242c32" font-weight="400">leaf: opt:a1 → a1；h-wait 保留，并参与冲突与后代检查</text><rect x="42" y="835" width="1276" height="110" rx="12" fill="#edf6f0" stroke="#b8d0c4"/><text x="62" y="869" font-size="20" fill="#242c32" font-weight="650">1  验证并构造候选</text><text x="480" y="869" font-size="20" fill="#a43a3a" font-weight="650">2  失败：保留整棵旧树</text><text x="905" y="869" font-size="20" fill="#227260" font-weight="650">3  成功：一次替换引用</text><text x="62" y="908" font-size="18" fill="#58646c" font-weight="400">旧引用没有被写入；观察者通过统一 store 取得新引用。这里没有跨线程或数据库事务。</text></svg>