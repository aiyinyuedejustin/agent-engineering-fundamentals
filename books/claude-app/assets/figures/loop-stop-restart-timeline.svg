<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
<title id="title">Stop 之后，晚到的成功也必须失效</title><desc id="desc">七个确定性事件：代次保护的是结果归属，idle 与进程存活分开记录。</desc>
<style>text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
<rect width="1120" height="670" fill="#f7f5ef"/>
<text x="36" y="48" font-size="28" fill="#252a30" font-weight="700">Stop 之后，晚到的成功也必须失效</text>
<text x="36" y="80" font-size="16" fill="#58616a" font-weight="400">七个确定性事件：代次保护的是结果归属，idle 与进程存活分开记录。</text>
<rect x="36" y="104" width="1048" height="44" rx="10" fill="#e9e6dd" stroke="#c7cbc9"/><text x="50" y="134" font-size="17" fill="#252a30" font-weight="700">事件次序</text><text x="405" y="134" font-size="17" fill="#252a30" font-weight="700">当前代次</text><text x="530" y="134" font-size="17" fill="#252a30" font-weight="700">会话状态</text><text x="745" y="134" font-size="17" fill="#252a30" font-weight="700">进程</text><text x="855" y="134" font-size="17" fill="#252a30" font-weight="700">结果归属</text><rect x="36" y="153" width="1048" height="49" rx="6" fill="#dbeaf8" stroke="#c7cbc9"/><text x="50" y="185" font-size="17" fill="#252a30" font-weight="400">1  A 开始，排队 message-A</text><text x="430" y="185" font-size="17" fill="#252a30" font-weight="400">1</text><text x="530" y="185" font-size="17" fill="#252a30" font-weight="400">initializing</text><text x="752" y="185" font-size="17" fill="#252a30" font-weight="400">无</text><text x="855" y="185" font-size="17" fill="#252a30" font-weight="400">A 的票据：1</text><rect x="36" y="207" width="1048" height="49" rx="6" fill="#f7e0d8" stroke="#c7cbc9"/><text x="50" y="239" font-size="17" fill="#252a30" font-weight="400">2  用户按 Stop</text><text x="430" y="239" font-size="17" fill="#252a30" font-weight="400">2</text><text x="530" y="239" font-size="17" fill="#252a30" font-weight="400">idle</text><text x="752" y="239" font-size="17" fill="#252a30" font-weight="400">无</text><text x="855" y="239" font-size="17" fill="#252a30" font-weight="400">旧票据失效</text><rect x="36" y="261" width="1048" height="49" rx="6" fill="#dbeaf8" stroke="#c7cbc9"/><text x="50" y="293" font-size="17" fill="#252a30" font-weight="400">3  B 开始，排队 message-B</text><text x="430" y="293" font-size="17" fill="#252a30" font-weight="400">3</text><text x="530" y="293" font-size="17" fill="#252a30" font-weight="400">initializing</text><text x="752" y="293" font-size="17" fill="#252a30" font-weight="400">无</text><text x="855" y="293" font-size="17" fill="#252a30" font-weight="400">B 的票据：3</text><rect x="36" y="315" width="1048" height="49" rx="6" fill="#f7e0d8" stroke="#c7cbc9"/><text x="50" y="347" font-size="17" fill="#252a30" font-weight="400">4  A 初始化成功，晚到</text><text x="430" y="347" font-size="17" fill="#252a30" font-weight="400">3</text><text x="530" y="347" font-size="17" fill="#252a30" font-weight="400">initializing</text><text x="752" y="347" font-size="17" fill="#252a30" font-weight="400">无</text><text x="855" y="347" font-size="17" fill="#252a30" font-weight="400">拒绝接管</text><rect x="36" y="369" width="1048" height="49" rx="6" fill="#dcece0" stroke="#c7cbc9"/><text x="50" y="401" font-size="17" fill="#252a30" font-weight="400">5  B 初始化成功</text><text x="430" y="401" font-size="17" fill="#252a30" font-weight="400">3</text><text x="530" y="401" font-size="17" fill="#252a30" font-weight="400">running</text><text x="752" y="401" font-size="17" fill="#252a30" font-weight="400">有</text><text x="855" y="401" font-size="17" fill="#252a30" font-weight="400">接管当前会话</text><rect x="36" y="423" width="1048" height="49" rx="6" fill="#f7e0d8" stroke="#c7cbc9"/><text x="50" y="455" font-size="17" fill="#252a30" font-weight="400">6  注入 A 的旧 result</text><text x="430" y="455" font-size="17" fill="#252a30" font-weight="400">3</text><text x="530" y="455" font-size="17" fill="#252a30" font-weight="400">running</text><text x="752" y="455" font-size="17" fill="#252a30" font-weight="400">有</text><text x="855" y="455" font-size="17" fill="#252a30" font-weight="400">stale，不结算 B</text><rect x="36" y="477" width="1048" height="49" rx="6" fill="#dcece0" stroke="#c7cbc9"/><text x="50" y="509" font-size="17" fill="#252a30" font-weight="400">7  B 的 result 成功</text><text x="430" y="509" font-size="17" fill="#252a30" font-weight="400">3</text><text x="530" y="509" font-size="17" fill="#252a30" font-weight="400">idle</text><text x="752" y="509" font-size="17" fill="#252a30" font-weight="400">有</text><text x="855" y="509" font-size="17" fill="#252a30" font-weight="400">回合结束，可保暖</text><rect x="36" y="548" width="1048" height="72" rx="10" fill="#fff" stroke="#c7cbc9"/><text x="54" y="578" font-size="18" fill="#252a30" font-weight="700">为什么只看状态会失败？</text><text x="54" y="605" font-size="17" fill="#252a30" font-weight="400">第 4 行仍是 initializing，但它属于 B。状态相同，不能证明异步结果身份相同。</text>
<text x="36" y="648" font-size="14" fill="#58616a" font-weight="400">原创教学模型 · 合成事件与数值 · 不表示产品的真实运行测量</text>
</svg>