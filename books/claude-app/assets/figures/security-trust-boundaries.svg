<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">内容与授权必须走不同通道</title><desc id="desc">原创教学图。资料只能提出动作，可信授权和资源限制共同决定是否执行。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#5b625d"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f7f4ee"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#252b27"><text x="42" y="56" font-size="30" fill="#252b27" font-weight="700">内容与授权，走不同的通道</text><text x="42" y="88" font-size="18" fill="#69716b" font-weight="400">A · 原创设计图：一个有效请求仍然需要授权与执行约束</text><rect x="40" y="140" width="280" height="130" rx="16" fill="#eee9e0" stroke="#d3d3c9"/><text x="60" y="175" font-size="22" fill="#252b27" font-weight="700">不可信资料</text><text x="60" y="206" font-size="17" fill="#58615a" font-weight="400">网页 / 文档 / 工具结果</text><text x="60" y="233" font-size="17" fill="#58615a" font-weight="400">来源信息与正文一起保留</text><rect x="390" y="140" width="330" height="130" rx="16" fill="#edf0e8" stroke="#d3d3c9"/><text x="410" y="175" font-size="22" fill="#252b27" font-weight="700">模型与计划生成</text><text x="410" y="206" font-size="17" fill="#58615a" font-weight="400">把资料当作数据</text><text x="410" y="233" font-size="17" fill="#58615a" font-weight="400">提出工具名、参数和目标</text><rect x="800" y="140" width="360" height="130" rx="16" fill="#e5ede8" stroke="#d3d3c9"/><text x="820" y="175" font-size="22" fill="#252b27" font-weight="700">执行前的权限判断</text><text x="820" y="206" font-size="17" fill="#58615a" font-weight="400">调用者、参数、会话、策略</text><text x="820" y="233" font-size="17" fill="#58615a" font-weight="400">资源身份与授权范围</text><path d="M320,205 L390,205" stroke="#5b625d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M720,205 L800,205" stroke="#5b625d" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="721" y="185" font-size="15" fill="#252b27" font-weight="400">提议</text><rect x="390" y="350" width="330" height="130" rx="16" fill="#f4e4d8" stroke="#d3d3c9"/><text x="410" y="385" font-size="22" fill="#252b27" font-weight="700">可信用户决定</text><text x="410" y="416" font-size="17" fill="#58615a" font-weight="400">明确动作与目的地</text><text x="410" y="443" font-size="17" fill="#58615a" font-weight="400">生成不可由正文伪造的票据</text><rect x="800" y="350" width="360" height="130" rx="16" fill="#e5ede8" stroke="#d3d3c9"/><text x="820" y="385" font-size="22" fill="#252b27" font-weight="700">受限执行器</text><text x="820" y="416" font-size="17" fill="#58615a" font-weight="400">文件 / 网络 / 浏览器 / OS</text><text x="820" y="443" font-size="17" fill="#58615a" font-weight="400">在资源边界继续限制影响</text><path d="M555,350 V305 H850 V270" stroke="#5b625d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="585" y="330" font-size="16" fill="#252b27" font-weight="400">授权记录</text><path d="M1060,270 L1060,350" stroke="#5b625d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="40" y="350" width="280" height="130" rx="16" fill="#f6e8e2" stroke="#d3d3c9"/><text x="60" y="385" font-size="22" fill="#252b27" font-weight="700">不能跨越的捷径</text><text x="60" y="416" font-size="17" fill="#58615a" font-weight="400">文档自称“已经批准”</text><text x="60" y="443" font-size="17" fill="#58615a" font-weight="400">不产生任何新权限</text><text x="42" y="558" font-size="22" fill="#252b27" font-weight="700">三件事必须分别证明</text><text x="42" y="600" font-size="20" fill="#252b27" font-weight="400">这是谁的内容？</text><text x="390" y="600" font-size="20" fill="#252b27" font-weight="400">谁有权批准这次动作？</text><text x="800" y="600" font-size="20" fill="#252b27" font-weight="400">执行器真正能触及什么？</text><text x="42" y="651" font-size="17" fill="#69716b" font-weight="400">静态客户端观察不等于服务器、native 或 OS 强制执行已经验证。</text></g></svg>