<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1026" viewBox="0 0 1360 1026" role="img" aria-labelledby="title desc"><title id="title">设置回滚和组织切换后拒绝迟到允许的两段轨迹</title><desc id="desc">两次排队写入先失败回滚再成功，随后组织切换使旧请求失效，旧组织的允许结果不覆盖当前组织拒绝。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58646c"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a43a3a"/></marker></defs><rect x="0" y="0" width="1360" height="1026" rx="0" fill="#faf8f3" stroke="#faf8f3"/><text x="42" y="53" font-size="31" fill="#242c32" font-weight="700">写入的顺序，和结果的归属，是两道约束</text><text x="42" y="88" font-size="18" fill="#58646c" font-weight="400">原创合成轨迹｜同 scope 串行写入 + 组织身份 + 请求代次 + 新鲜度</text><rect x="42" y="116" width="1276" height="427" rx="14" fill="#ffffff" stroke="#d8ddd9"/><text x="65" y="153" font-size="24" fill="#242c32" font-weight="650">上半场：A1 失败之后，A2 才捕获自己的起点</text><text x="66" y="193" font-size="17" fill="#58646c" font-weight="600">操作 / 阶段</text><text x="513" y="193" font-size="17" fill="#58646c" font-weight="600">org-a 缓存：enabled / mode / revision</text><text x="1034" y="193" font-size="17" fill="#58646c" font-weight="600">关键保证</text><rect x="60" y="211" width="1240" height="49" rx="7" fill="#f5f6f2" stroke="#d8ddd9"/><text x="76" y="243" font-size="18" fill="#242c32" font-weight="400">两次提交，但 operation 尚未执行</text><text x="529" y="243" font-size="19" fill="#242c32" font-weight="550">false / summary / 7</text><text x="1048" y="243" font-size="17" fill="#58646c" font-weight="400">第二次未乐观写入</text><rect x="60" y="266" width="1240" height="49" rx="7" fill="#f5f6f2" stroke="#d8ddd9"/><text x="76" y="298" font-size="18" fill="#242c32" font-weight="400">A1 开始：开启记忆</text><text x="529" y="298" font-size="19" fill="#242c32" font-weight="550">true / summary / 7</text><text x="1048" y="298" font-size="17" fill="#58646c" font-weight="400">A2 仍在排队</text><rect x="60" y="321" width="1240" height="49" rx="7" fill="#fff0eb" stroke="#d8ddd9"/><text x="76" y="353" font-size="18" fill="#a43a3a" font-weight="400">A1 失败：先回滚</text><text x="529" y="353" font-size="19" fill="#242c32" font-weight="550">false / summary / 7</text><text x="1048" y="353" font-size="17" fill="#58646c" font-weight="400">恢复 A1.previous</text><rect x="60" y="376" width="1240" height="49" rx="7" fill="#f5f6f2" stroke="#d8ddd9"/><text x="76" y="408" font-size="18" fill="#242c32" font-weight="400">A2 开始：切换主题模式</text><text x="529" y="408" font-size="19" fill="#242c32" font-weight="550">false / topics / 7</text><text x="1048" y="408" font-size="17" fill="#227260" font-weight="400">基线已回滚</text><rect x="60" y="431" width="1240" height="49" rx="7" fill="#edf6f0" stroke="#d8ddd9"/><text x="76" y="463" font-size="18" fill="#242c32" font-weight="400">A2 成功：采用权威响应</text><text x="529" y="463" font-size="19" fill="#242c32" font-weight="550">false / topics / 8</text><text x="1048" y="463" font-size="17" fill="#227260" font-weight="400">拒绝不毒死队列</text><text x="65" y="522" font-size="18" fill="#58646c" font-weight="400">previous 在 operation 开始时捕获；回滚只恢复 org-a，不恢复整张 Map。</text><text x="42" y="590" font-size="24" fill="#242c32" font-weight="650">下半场：来自 A 的迟到 allow，不能覆盖 B 的当前 deny</text><rect x="42" y="622" width="295" height="176" rx="14" fill="#ffffff" stroke="#d8ddd9"/><text x="60" y="657" font-size="19" fill="#316a8e" font-weight="650">08  A 开始刷新</text><text x="60" y="695" font-size="18" fill="#242c32" font-weight="400">org-a / ticket v1</text><text x="60" y="731" font-size="17" fill="#242c32" font-weight="400">旧 allow 已过期</text><text x="60" y="770" font-size="16" fill="#58646c" font-weight="400">now=1000，预算=100</text><path d="M341 711H363" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><rect x="369" y="622" width="295" height="176" rx="14" fill="#ffffff" stroke="#d8ddd9"/><text x="387" y="657" font-size="19" fill="#316a8e" font-weight="650">09  切换组织 B</text><text x="387" y="695" font-size="18" fill="#242c32" font-weight="400">org-b / 代次 v2</text><text x="387" y="731" font-size="17" fill="#242c32" font-weight="400">清空活动快照</text><text x="387" y="770" font-size="16" fill="#58646c" font-weight="400">invalidate 旧票据</text><path d="M668 711H690" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><rect x="696" y="622" width="295" height="176" rx="14" fill="#ffffff" stroke="#d8ddd9"/><text x="714" y="657" font-size="19" fill="#316a8e" font-weight="650">10  B 读取并拒绝</text><text x="714" y="695" font-size="18" fill="#242c32" font-weight="400">org-b / ticket v3</text><text x="714" y="731" font-size="17" fill="#242c32" font-weight="400">blocked_by_org_admin</text><text x="714" y="770" font-size="16" fill="#58646c" font-weight="400">当前结果：allowed=false</text><path d="M995 711H1017" fill="none" stroke="#58646c" stroke-width="2" marker-end="url(#arrow)"/><rect x="1023" y="622" width="295" height="176" rx="14" fill="#fff1ed" stroke="#a43a3a"/><text x="1041" y="657" font-size="19" fill="#a43a3a" font-weight="650">11  A 的 allow 到达</text><text x="1041" y="695" font-size="18" fill="#242c32" font-weight="400">org-a / ticket v1</text><text x="1041" y="731" font-size="17" fill="#242c32" font-weight="400">过时代次，拒绝接纳</text><text x="1041" y="770" font-size="16" fill="#58646c" font-weight="400">保留 B 的 deny</text><path d="M189 802V831H1170V803" fill="none" stroke="#a43a3a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#red)"/><text x="438" y="823" font-size="17" fill="#a43a3a" font-weight="400">A 的响应一直在路上；切换视图并不保证它停止交付。</text><rect x="42" y="859" width="1276" height="136" rx="14" fill="#edf6f0" stroke="#b8d0c4"/><text x="64" y="896" font-size="22" fill="#227260" font-weight="650">接纳前检查</text><text x="250" y="896" font-size="19" fill="#242c32" font-weight="550">票据仍当前  AND  票据组织 = 活动组织  AND  响应组织 = 票据组织</text><text x="64" y="934" font-size="19" fill="#242c32" font-weight="400">await 之后再检查一次：即使刚才命中了新鲜缓存，也可能已切换组织。</text><text x="64" y="970" font-size="17" fill="#58646c" font-weight="400">本例只返回是否允许；不执行真实动作，不认证组织身份，不代替服务端权限检查。</text></svg>