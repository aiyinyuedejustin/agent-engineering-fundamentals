<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">把检查点放进工作里</title>
<desc id="desc">原创有效输入实验，计数不是 FPS 或耗时，也不描述 Claude 的真实运行。相同输入包含 180000 字节、20000 个短事件。整块路径一次 push 180000 字节，先生成 20000 帧，再执行全部回调，首次 afterChunk 检查点发生在第 20000 次回调后。分片路径每次 push 最多 4096 字节，同片每交付 128 帧到达检查点并让出，片尾即使没有完整帧也让出；本输入首次让出发生在第 128 次回调后，全部 20000 帧保持原顺序。这里是逻辑计数，不保证帧率、耗时或实时响应；单次同步解析和单个回调仍不可被抢占。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif}</style>
<defs><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4.5L0 9Z" fill="#68665c"/></marker><marker id="arrow-sage" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4.5L0 9Z" fill="#40634d"/></marker><marker id="arrow-rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4.5L0 9Z" fill="#984a36"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4.5L0 9Z" fill="#395d70"/></marker></defs>
<rect x="0" y="0" width="1000" height="650" rx="0" fill="#f5f1e8"/>
<text id="text-1" x="36" y="35" font-size="14" fill="#984a36" font-weight="600" text-anchor="start">原创合成实验 · 输入片与回调检查点</text>
<text id="text-2" x="36" y="80" font-size="30" fill="#29291f" font-weight="700" text-anchor="start">把检查点放进工作里</text>
<text id="text-3" x="36" y="111" font-size="17" fill="#68665c" font-weight="400" text-anchor="start">同一段有效输入，改变的是到下一次检查点之前的工作量。</text>
<rect x="36" y="132" width="928" height="53" rx="12" fill="#fffdf7" stroke="#d8d0bf" stroke-width="1.2"/>
<text id="text-4" x="59" y="166" font-size="18" fill="#68665c" font-weight="600" text-anchor="start">同一输入</text>
<text id="text-5" x="183" y="166" font-size="24" fill="#29291f" font-weight="700" text-anchor="start">180,000 字节  /  20,000 个短事件</text>
<text id="text-6" x="942" y="166" font-size="16" fill="#40634d" font-weight="600" text-anchor="end">顺序保持</text>
<rect x="36" y="201" width="450" height="340" rx="12" fill="#fffdf7" stroke="#d8d0bf" stroke-width="1.2"/>
<rect x="53" y="218" width="5" height="28" rx="2" fill="#984a36"/>
<text id="text-7" x="71" y="242" font-size="25" fill="#984a36" font-weight="700" text-anchor="start">整块 push</text>
<rect x="57" y="262" width="408" height="43" rx="8" fill="#f3e4dc"/>
<rect x="57" y="323" width="408" height="43" rx="8" fill="#f3e4dc"/>
<path d="M261 308V320" fill="none" stroke="#984a36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rust)"/>
<rect x="514" y="201" width="450" height="340" rx="12" fill="#fffdf7" stroke="#d8d0bf" stroke-width="1.2"/>
<rect x="531" y="218" width="5" height="28" rx="2" fill="#40634d"/>
<text id="text-8" x="549" y="242" font-size="25" fill="#40634d" font-weight="700" text-anchor="start">分片 + 帧检查点</text>
<rect x="535" y="262" width="408" height="43" rx="8" fill="#e6eee5"/>
<rect x="535" y="323" width="408" height="43" rx="8" fill="#e6eee5"/>
<path d="M739 308V320" fill="none" stroke="#40634d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-sage)"/>
<text id="text-9" x="261" y="290" font-size="20" fill="#984a36" font-weight="600" text-anchor="middle">一次 push：180,000 字节</text>
<text id="text-10" x="261" y="351" font-size="20" fill="#984a36" font-weight="600" text-anchor="middle">先生成全部 20,000 帧</text>
<path d="M261 370V394" fill="none" stroke="#984a36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rust)"/>
<text id="text-11" x="261" y="417" font-size="17" fill="#68665c" font-weight="500" text-anchor="middle">首次 afterChunk 检查点前</text>
<text id="text-12" x="261" y="476" font-size="48" fill="#984a36" font-weight="700" text-anchor="middle">20,000</text>
<text id="text-13" x="261" y="511" font-size="18" fill="#984a36" font-weight="500" text-anchor="middle">次回调，才到首次让出机会</text>
<text id="text-14" x="739" y="290" font-size="20" fill="#40634d" font-weight="600" text-anchor="middle">每次 push ≤ 4,096 字节</text>
<text id="text-15" x="739" y="351" font-size="20" fill="#40634d" font-weight="600" text-anchor="middle">每交付 128 帧 → 检查点</text>
<text id="text-16" x="739" y="387" font-size="17" fill="#68665c" font-weight="500" text-anchor="middle">继续当前片；片尾也让出</text>
<text id="text-17" x="739" y="417" font-size="17" fill="#68665c" font-weight="500" text-anchor="middle">本输入首次让出前</text>
<text id="text-18" x="739" y="476" font-size="48" fill="#40634d" font-weight="700" text-anchor="middle">128</text>
<text id="text-19" x="739" y="511" font-size="18" fill="#40634d" font-weight="500" text-anchor="middle">次回调，随后继续按序交付</text>
<rect x="36" y="558" width="928" height="60" rx="10" fill="#f3ebd5"/>
<text id="text-20" x="57" y="584" font-size="20" fill="#856326" font-weight="700" text-anchor="start">逻辑计数，不是 FPS 或耗时</text>
<text id="text-21" x="57" y="607" font-size="16" fill="#68665c" font-weight="400" text-anchor="start">小片与检查点不能抢占单个同步解析或回调；全部 20,000 帧仍须按序处理。</text>
<text id="text-22" x="36" y="639" font-size="14" fill="#68665c" font-weight="400" text-anchor="start">本图仅解释原创实验的检查粒度，不代表 Claude 实测、帧率或实时响应保证。</text>
</svg>
