<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">工具名称不能充当授权的全部身份</title><desc id="desc">保守原创策略：配置来源、修订、连接代次或参数变化，都使本次旧批准失效。</desc>
<style>text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
<rect width="1120" height="690" fill="#f7f5ef"/>
<text x="36" y="48" font-size="28" fill="#252a30" font-weight="700">工具名称不能充当授权的全部身份</text>
<text x="36" y="80" font-size="16" fill="#58616a" font-weight="400">保守原创策略：配置来源、修订、连接代次或参数变化，都使本次旧批准失效。</text>
<rect x="36" y="112" width="496" height="334" rx="10" fill="#dbeaf8" stroke="#c7cbc9"/><text x="58" y="148" font-size="22" fill="#252a30" font-weight="700">用户审查的调用</text><rect x="588" y="112" width="496" height="334" rx="10" fill="#f7e0d8" stroke="#c7cbc9"/><text x="610" y="148" font-size="22" fill="#252a30" font-weight="700">重连后的候选调用</text><text x="58" y="192" font-size="17" fill="#58616a" font-weight="400">server</text><text x="221" y="192" font-size="18" fill="#252a30" font-weight="400">notes</text><text x="610" y="192" font-size="17" fill="#58616a" font-weight="400">server</text><text x="773" y="192" font-size="18" fill="#252a30" font-weight="400">notes</text><text x="58" y="231" font-size="17" fill="#58616a" font-weight="400">source</text><text x="221" y="231" font-size="18" fill="#252a30" font-weight="600">extension:sample</text><text x="610" y="231" font-size="17" fill="#58616a" font-weight="400">source</text><text x="773" y="231" font-size="18" fill="#252a30" font-weight="600">manual:sample</text><text x="58" y="270" font-size="17" fill="#58616a" font-weight="400">revision</text><text x="221" y="270" font-size="18" fill="#252a30" font-weight="600">1</text><text x="610" y="270" font-size="17" fill="#58616a" font-weight="400">revision</text><text x="773" y="270" font-size="18" fill="#252a30" font-weight="600">2</text><text x="58" y="309" font-size="17" fill="#58616a" font-weight="400">generation</text><text x="221" y="309" font-size="18" fill="#252a30" font-weight="600">1</text><text x="610" y="309" font-size="17" fill="#58616a" font-weight="400">generation</text><text x="773" y="309" font-size="18" fill="#252a30" font-weight="600">2</text><text x="58" y="348" font-size="17" fill="#58616a" font-weight="400">tool</text><text x="221" y="348" font-size="18" fill="#252a30" font-weight="400">read_note</text><text x="610" y="348" font-size="17" fill="#58616a" font-weight="400">tool</text><text x="773" y="348" font-size="18" fill="#252a30" font-weight="400">read_note</text><text x="58" y="387" font-size="17" fill="#58616a" font-weight="400">arguments</text><text x="221" y="387" font-size="18" fill="#252a30" font-weight="400">notes/meeting.txt</text><text x="610" y="387" font-size="17" fill="#58616a" font-weight="400">arguments</text><text x="773" y="387" font-size="18" fill="#252a30" font-weight="400">notes/meeting.txt</text><rect x="36" y="466" width="1048" height="56" rx="10" fill="#fff" stroke="#c7cbc9"/><text x="54" y="501" font-size="18" fill="#252a30" font-weight="400">同一个显示名 ≠ 同一个服务绑定。模型重算绑定 + 参数摘要，不匹配则拒绝旧批准。</text><rect x="36" y="544" width="504" height="96" rx="10" fill="#dcece0" stroke="#c7cbc9"/><rect x="564" y="544" width="520" height="96" rx="10" fill="#fff" stroke="#c7cbc9"/><text x="56" y="578" font-size="19" fill="#252a30" font-weight="700">一次批准的消费条件</text><text x="56" y="609" font-size="16" fill="#252a30" font-weight="400">当前策略允许 + 连接就绪 + 绑定与参数匹配</text><text x="584" y="578" font-size="19" fill="#252a30" font-weight="700">这仍然没有证明什么？</text><text x="584" y="609" font-size="16" fill="#252a30" font-weight="400">服务身份真实、OS 沙箱、远端资源授权。</text>
<text x="36" y="668" font-size="14" fill="#58616a" font-weight="400">原创教学模型 · 合成事件与数值 · 不表示产品的真实运行测量</text>
</svg>