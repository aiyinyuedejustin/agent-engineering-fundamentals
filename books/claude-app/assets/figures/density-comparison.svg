width="630" height="478" rx="20" fill="#ffffff" fill-opacity="1" stroke="#d6d2c7" stroke-width="1" /><text id="t12" x="746" y="197" fill="#24231f" font-size="25" font-weight="650" text-anchor="start" >comfortable 覆盖</text><text id="t13" x="746" y="230" fill="#5f5d55" font-size="17" font-weight="400" text-anchor="start" >同内容样本 · 字号 / 控件 / 圆角均以 2 倍绘出</text><rect x="746" y="256" width="582" height="286" rx="24" fill="#f9f9f7" fill-opacity="1" stroke="#d9d8d3" stroke-width="1" /><text id="t14" x="770" y="299" fill="#24231f" font-size="28" font-weight="600" text-anchor="start" >界面：研究资料</text><text id="t15" x="770" y="349" fill="#24231f" font-size="32" font-weight="400" text-anchor="start" >先整理问题，</text><text id="t16" x="770" y="397" fill="#24231f" font-size="32" font-weight="400" text-anchor="start" >再决定下一步。</text><rect x="770" y="446" width="198" height="64" rx="16" fill="#e9e6dc" fill-opacity="1" stroke="none" stroke-width="1" /><rect x="790" y="458" width="40" height="40" rx="3" fill="none" fill-opacity="1" stroke="#24231f" stroke-width="2" /><text id="t17" x="845" y="488.08" fill="#24231f" font-size="28" font-weight="500" text-anchor="start" >复制</text><text id="t18" x="746" y="578" fill="#24231f" font-size="20" font-weight="600" text-anchor="start" >body 14 / 20px　prose 16 / 24px</text><text id="t19" x="746" y="610" fill="#5f5d55" font-size="19" font-weight="400" text-anchor="start" >控件 32px　图标 20px　panel radius 12px</text><text id="t20" x="48" y="686" fill="#24231f" font-size="26" font-weight="650" text-anchor="start" >并排核对：有些量增幅大，有些量只增加一点</text><rect x="48" y="711" width="1304" height="335" rx="18" fill="#ffffff" fill-opacity="1" stroke="#d6d2c7" stroke-width="1" /><text id="t21" x="72" y="751" fill="#5f5d55" font-size="21" font-weight="600" text-anchor="start" >角色</text><text id="t22" x="682" y="751" fill="#5f5d55" font-size="21" font-weight="600" text-anchor="start" >默认</text><text id="t23" x="1025" y="751" fill="#5f5d55" font-size="21" font-weight="600" text-anchor="start" >comfortable</text><line x1="72" y1="769" x2="1328" y2="769" stroke="#e6e2d8" stroke-width="1"/><text id="t24" x="72" y="799" fill="#24231f" font-size="21" font-weight="400" text-anchor="start" >控件高度 / 内嵌控件</text><g data-profile="cds_light" data-density-tokens="--cds-h-control,--cds-h-control-nested"><text id="t25" x="682" y="799" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >24 / 18 px</text></g><g data-profile="cds_comfortable" data-density-tokens="--cds-h-control,--cds-h-control-nested"><text id="t26" x="1025" y="799" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >32 / 22 px</text></g><line x1="72" y1="818" x2="1328" y2="818" stroke="#e6e2d8" stroke-width="1"/><text id="t27" x="72" y="848" fill="#24231f" font-size="21" font-weight="400" text-anchor="start" >图标 / 基础圆角</text><g data-profile="cds_light" data-density-tokens="--cds-icon,--cds-radius"><text id="t28" x="682" y="848" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >16 / 6 px</text></g><g data-profile="cds_comfortable" data-density-tokens="--cds-icon,--cds-radius"><text id="t29" x="1025" y="848" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >20 / 8 px</text></g><line x1="72" y1="867" x2="1328" y2="867" stroke="#e6e2d8" stroke-width="1"/><text id="t30" x="72" y="897" fill="#24231f" font-size="21" font-weight="400" text-anchor="start" >composer / panel 圆角</text><g data-profile="cds_light" data-density-tokens="--cds-radius-composer,--cds-panel-radius"><text id="t31" x="682" y="897" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >12 / 10 px</text></g><g data-profile="cds_comfortable" data-density-tokens="--cds-radius-composer,--cds-panel-radius"><text id="t32" x="1025" y="897" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >14 / 12 px</text></g><line x1="72" y1="916" x2="1328" y2="916" stroke="#e6e2d8" stroke-width="1"/><text id="t33" x="72" y="946" fill="#24231f" font-size="21" font-weight="400" text-anchor="start" >body 字号 / 行高</text><g data-profile="cds_light" data-density-tokens="--cds-font-size-body,--cds-leading-body"><text id="t34" x="682" y="946" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >13 / 19 px</text></g><g data-profile="cds_comfortable" data-density-tokens="--cds-font-size-body,--cds-leading-body"><text id="t35" x="1025" y="946" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >14 / 20 px</text></g><line x1="72" y1="965" x2="1328" y2="965" stroke="#e6e2d8" stroke-width="1"/><text id="t36" x="72" y="995" fill="#24231f" font-size="21" font-weight="400" text-anchor="start" >prose 字号 / 行高</text><g data-profile="cds_light" data-density-tokens="--cds-font-size-prose,--cds-leading-prose"><text id="t37" x="682" y="995" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >14 / 20 px</text></g><g data-profile="cds_comfortable" data-density-tokens="--cds-font-size-prose,--cds-leading-prose"><text id="t38" x="1025" y="995" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >16 / 24 px</text></g><rect x="48" y="1071" width="1304" height="162" rx="18" fill="#e9e6dd" fill-opacity="1" stroke="none" stroke-width="1" /><text id="t39" x="72" y="1111" fill="#24231f" font-size="23" font-weight="650" text-anchor="start" >间距序列也分别变动（xs → xl）</text><text id="t40" x="72" y="1153" fill="#5f5d55" font-size="20" font-weight="600" text-anchor="start" >pad</text><text id="t41" x="260" y="1153" fill="#24231f" font-size="20" font-weight="400" text-anchor="start" >默认  4 / 6 / 8 / 12 / 20 px</text><text id="t42" x="790" y="1153" fill="#24231f" font-size="20" font-weight="400" text-anchor="start" >comfortable  6 / 8 / 12 / 16 / 24 px</text><text id="t43" x="72" y="1190" fill="#5f5d55" font-size="20" font-weight="600" text-anchor="start" >gap</text><text id="t44" x="260" y="1190" fill="#24231f" font-size="20" font-weight="400" text-anchor="start" >默认  6 / 8 / 12 / 20 / 32 px</text><text id="t45" x="790" y="1190" fill="#24231f" font-size="20" font-weight="400" text-anchor="start" >comfortable  8 / 12 / 16 / 28 / 40 px</text><text id="t46" x="48" y="1283" fill="#24231f" font-size="26" font-weight="650" text-anchor="start" >另一条独立轴：消息正文的 sm / md / lg 偏好</text><text id="t47" x="48" y="1324" fill="#24231f" font-size="21" font-weight="400" text-anchor="start" >正文偏好会改写消息文字相关令牌；内部按钮有恢复自身字号的规则。</text><text id="t48" x="48" y="1358" fill="#24231f" font-size="21" font-weight="400" text-anchor="start" >因此“更大的阅读文字”不必把复制、菜单等工具一起同比放大。</text><line x1="48" y1="1410" x2="1352" y2="1410" stroke="#d6d2c7" stroke-width="1"/><text id="t49" x="48" y="1438" fill="#5f5d55" font-size="17" font-weight="400" text-anchor="start" >尺寸来源：data/design-token-summary.json → selected_tokens.density；正文 / 工具独立规则见 message_text_preferences。</text><text id="t50" x="48" y="1464" fill="#5f5d55" font-size="17" font-weight="400" text-anchor="start" >prose 字号与行高直接使用 rem；许多 UI 尺寸还乘 rem-scale。样本只在本图假设下比较，未模拟完整级联。</text><text id="t51" x="48" y="1490" fill="#5f5d55" font-size="17" font-weight="400" text-anchor="start" >另有 step、size、文本偏好与触摸分支。本图比较所选配置，不声称它们就是每位用户看到的最终密度。</text></svg>