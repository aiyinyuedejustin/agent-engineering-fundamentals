<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title"><title id="title">Claude App 工程研究全景</title><style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif}</style><rect width="1440" height="720" fill="#f5f3ec"/><text x="60" y="64" font-size="18" fill="#a65539" font-weight="600">CLAUDE APP / ENGINEERING ATLAS</text><text x="60" y="116" font-size="38" fill="#25231e" font-weight="700">从可见的界面，到可控的执行</text><text x="60" y="154" font-size="20" fill="#67645c" font-weight="400">设计提供秩序，状态连接动作，边界决定能力。</text><rect x="60" y="210" width="420" height="200" rx="20" fill="#efe8dc"/><text x="90" y="258" font-size="27" fill="#25231e" font-weight="650">01  界面</text><text x="90" y="311" font-size="21" fill="#25231e" font-weight="400">色板 · 排版 · 组件</text><text x="90" y="354" font-size="18" fill="#625f58" font-weight="400">聊天 / 工作区 / 轻入口</text><rect x="510" y="210" width="420" height="200" rx="20" fill="#e7ece7"/><text x="540" y="258" font-size="27" fill="#25231e" font-weight="650">02  状态</text><text x="540" y="311" font-size="21" fill="#25231e" font-weight="400">消息树 · 流式块 · 任务</text><text x="540" y="354" font-size="18" fill="#625f58" font-weight="400">草稿 / 权限 / 恢复</text><rect x="960" y="210" width="420" height="200" rx="20" fill="#e9e7ed"/><text x="990" y="258" font-size="27" fill="#25231e" font-weight="650">03  能力</text><text x="990" y="311" font-size="21" fill="#25231e" font-weight="400">IPC · MCP · 工具契约</text><text x="990" y="354" font-size="18" fill="#625f58" font-weight="400">屏幕 / 文件 / 终端</text><path d="M482 308 h24 m-8 -7 8 7 -8 7" stroke="#9a6a50" stroke-width="2" fill="none"/><path d="M932 308 h24 m-8 -7 8 7 -8 7" stroke="#9a6a50" stroke-width="2" fill="none"/><rect x="60" y="455" width="1320" height="170" rx="20" fill="#fcfcfa" stroke="#d9d5cb"/><text x="90" y="505" font-size="25" fill="#25231e" font-weight="650">执行与承载</text><text x="90" y="547" font-size="21" fill="#25231e" font-weight="400">Electron 外壳</text><text x="385" y="547" font-size="21" fill="#25231e" font-weight="400">托管 / 随包前端</text><text x="725" y="547" font-size="21" fill="#25231e" font-weight="400">主机 / 虚拟机</text><text x="1070" y="547" font-size="21" fill="#25231e" font-weight="400">模型与外部工具</text><text x="90" y="588" font-size="19" fill="#67645c" font-weight="400">不同模块拥有独立的生命周期、权限与失败路径；用条件和接口连接，而不是混成一个黑盒。</text><text x="60" y="677" font-size="17" fill="#67645c" font-weight="400">原创架构示意  ·  每条关系在章节中展开  ·  同一客户端可按部署与平台选择不同路径</text></svg>