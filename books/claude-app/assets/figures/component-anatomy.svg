<title id="figure-title">组件解剖：完整 composer、条件插槽、独立 Quick Entry 与 Card 层</title><desc id="figure-desc">原创结构示意，不是当前应用截图。复合 composer 的槽位以目录分开列出，不宣称同时可见；Quick Entry 是另一个本地 HTML 表面。卡片层来自 C07 和 card_surface/card_press 静态规则。</desc>
