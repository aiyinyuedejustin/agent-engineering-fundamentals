<rect x="0" y="0" width="1400" height="1340" rx="0" fill="#f2f0e9" fill-opacity="1" stroke="none" stroke-width="1" /><text id="t1" x="48" y="41" fill="#8f4831" font-size="17" font-weight="650" text-anchor="start" >02 / 组件解剖</text><text id="t2" x="48" y="88" fill="#24231f" font-size="34" font-weight="650" text-anchor="start" >完整输入面、轻入口和卡片，各自承担一件事</text><text id="t3" x="48" y="124" fill="#5f5d55" font-size="19" font-weight="400" text-anchor="start" >布局与尺寸比例为原创示意；组件命名来自包内静态证据，运行时启用情况未确认。</text><text id="t4" x="48" y="177" fill="#24231f" font-size="24" font-weight="650" text-anchor="start" >A  完整 composer：编辑与工具分层</text><rect x="950" y="153" width="285" height="32" rx="16" fill="#e6e2d6" fill-opacity="1" stroke="none" stroke-width="1" /><text id="t5" x="964" y="175" fill="#5f5d55" font-size="16" font-weight="500" text-anchor="start" >C05 / C06 · 包内组件</text><rect x="48" y="202" width="828" height="347" rx="22" fill="none" fill-opacity="1" stroke="#245b7c" stroke-width="2" stroke-dasharray="8 7" /><text id="t6" x="70" y="235" fill="#245b7c" font-size="19" font-weight="600" text-anchor="start" >ChatComposerDock · 独立停靠包装层</text><rect x="75" y="256" width="774" height="257" rx="22" fill="#ffffff" fill-opacity="1" stroke="#bbb7ab" stroke-width="1.5" /><text id="t7" x="103" y="299" fill="#5f5d55" font-size="25" font-weight="400" text-anchor="start" >在这里写清楚你想完成的事……</text><line x1="103" y1="330" x2="104" y2="362" stroke="#8f4831" stroke-width="2"/><text id="t8" x="103" y="388" fill="#5f5d55" font-size="17" font-weight="400" text-anchor="start" >编辑区域 · 此处只示意输入，不恢复实际编辑器 DOM</text><rect x="100" y="430" width="46" height="46" rx="10" fill="#f2f0e9" fill-opacity="1" stroke="none" stroke-width="1" /><path d="M 113 453 H 133 M 123 443 V 463" fill="none" stroke="#24231f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="158" y="430" width="100" height="46" rx="10" fill="#f2f0e9" fill-opacity="1" stroke="none" stroke-width="1" /><text id="t9" x="208" y="460" fill="#24231f" font-size="20" font-weight="500" text-anchor="middle" >工具</text><text id="t10" x="592" y="459" fill="#5f5d55" font-size="20" font-weight="400" text-anchor="start" >模型 / 模式</text><path d="M 722 451 L 727 456 L 732 451" fill="none" stroke="#5f5d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="769" y="430" width="50" height="46" rx="10" fill="#c6613f" fill-opacity="1" stroke="none" stroke-width="1" /><path d="M 794 464 V 442 M 786 450 L 794 442 L 802 450" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="453" r="15" fill="#245b7c"/><text id="t11" x="280" y="459" fill="#ffffff" font-size="17" font-weight="650" text-anchor="middle" >1</text><circle cx="829" cy="422" r="15" fill="#245b7c"/><text id="t12" x="829" y="428" fill="#ffffff" font-size="17" font-weight="650" text-anchor="middle" >2</text><text id="t13" x="70" y="580" fill="#24231f" font-size="20" font-weight="600" text-anchor="start" >1  Actions · 辅助操作</text><text id="t14" x="410" y="580" fill="#24231f" font-size="20" font-weight="600" text-anchor="start" >2  PrimaryAction · 主动作</text><text id="t15" x="70" y="610" fill="#5f5d55" font-size="18" font-weight="400" text-anchor="start" >此例仅组装输入、工具、模型与提交；不是产品的默认状态截图。</text><rect x="908" y="202" width="444" height="410" rx="20" fill="#e9e6dd" fill-opacity="1" stroke="none" stroke-width="1" /><text id="t16" x="932" y="239" fill="#24231f" font-size="23" font-weight="650" text-anchor="start" >条件插槽清单</text><text id="t17" x="932" y="269" fill="#5f5d55" font-size="18" font-weight="400" text-anchor="start" >不在左图中全部同时铺开</text><rect x="932" y="285" width="18" height="18" rx="4" fill="none" fill-opacity="1" stroke="#245b7c" stroke-width="1.5" stroke-dasharray="4 3" /><text id="t18" x="963" y="308" fill="#24231f" font-size="20" font-weight="550" text-anchor="start" >Header</text><text id="t19" x="1195" y="308" fill="#5f5d55" font-size="18" font-weight="400" text-anchor="start" >头部插槽</text><rect x="932" y="330" width="18" height="18" rx="4" fill="none" fill-opacity="1" stroke="#245b7c" stroke-width="1.5" stroke-dasharray="4 3" /><text id="t20" x="963" y="353" fill="#24231f" font-size="20" font-weight="550" text-anchor="start" >Attachments</text><text id="t21" x="1195" y="353" fill="#5f5d55" font-size="18" font-weight="400" text-anchor="start" >附件区</text><rect x="932" y="375" width="18" height="18" rx="4" fill="none" fill-opacity="1" stroke="#245b7c" stroke-width="1.5" stroke-dasharray="4 3" /><text id="t22" x="963" y="398" fill="#24231f" font-size="20" font-weight="550" text-anchor="start" >Chin</text><text id="t23" x="1195" y="398" fill="#5f5d55" font-size="18" font-weight="400" text-anchor="start" >底栏插槽</text><rect x="932" y="420" width="18" height="18" rx="4" fill="none" fill-opacity="1" stroke="#245b7c" stroke-width="1.5" stroke-dasharray="4 3" /><text id="t24" x="963" y="443" fill="#24231f" font-size="20" font-weight="550" text-anchor="start" >Overlay</text><text id="t25" x="1195" y="443" fill="#5f5d55" font-size="18" font-weight="400" text-anchor="start" >覆盖层插槽</text><rect x="932" y="465" width="18" height="18" rx="4" fill="none" fill-opacity="1" stroke="#245b7c" stroke-width="1.5" stroke-dasharray="4 3" /><text id="t26" x="963" y="488" fill="#24231f" font-size="20" font-weight="550" text-anchor="start" >Tray</text><text id="t27" x="1195" y="488" fill="#5f5d55" font-size="18" font-weight="400" text-anchor="start" >托盘插槽</text><text id="t28" x="932" y="554" fill="#5f5d55" font-size="16" font-weight="400" text-anchor="start" >可见性和组合取决于 variant / state。</text><text id="t29" x="932" y="578" fill="#5f5d55" font-size="16" font-weight="400" text-anchor="start" >new / reply、busy、disabled、drag-over</text><text id="t30" x="932" y="602" fill="#5f5d55" font-size="16" font-weight="400" text-anchor="start" >等状态名称来自 C06；不等于全部已启用。</text><line x1="48" y1="645" x2="1352" y2="645" stroke="#d6d2c7" stroke-width="1"/><text id="t31" x="48" y="686" fill="#24231f" font-size="24" font-weight="650" text-anchor="start" >B  Quick Entry：独立本地窗口，初始紧凑为一行</text><rect x="1055" y="663" width="276" height="32" rx="16" fill="#e6e2d6" fill-opacity="1" stroke="none" stroke-width="1" /><text id="t32" x="1069" y="685" fill="#5f5d55" font-size="16" font-weight="500" text-anchor="start" >C11 / C12 · 包内</text><rect x="66" y="721" width="810" height="90" rx="22" fill="#ffffff" fill-opacity="1" stroke="#d6d2c7" stroke-width="1" filter="url(#soft-shadow)"/><text id="t33" x="93" y="777" fill="#5f5d55" font-size="23" font-weight="400" text-anchor="start" >直接输入一个问题……</text><text id="t34" x="599" y="777" fill="#24231f" font-size="20" font-weight="400" text-anchor="start" >新对话</text><path d="M 682 763 L 689 770 L 696 763" fill="none" stroke="#5f5d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="796" y="742" width="54" height="48" rx="10" fill="#c6613f" fill-opacity="1" stroke="none" stroke-width="1" /><path d="M 823 777 V 755 M 815 763 L 823 755 L 831 763" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text id="t35" x="66" y="853" fill="#5f5d55" font-size="18" font-weight="400" text-anchor="start" >输入与上下文、提交共用一条水平轴；支持随文本增长调整高度（静态处理器）。</text><text id="t36" x="929" y="746" fill="#24231f" font-size="20" font-weight="400" text-anchor="start" >输入行 min-height：56px</text><text id="t37" x="929" y="780" fill="#24231f" font-size="20" font-weight="400" text-anchor="start" >容器 radius：16px</text><text id="t38" x="929" y="814" fill="#24231f" font-size="20" font-weight="400" text-anchor="start" >文字：16px / 150% 行高</text><text id="t39" x="929" y="848" fill="#24231f" font-size="20" font-weight="400" text-anchor="start" >这些尺寸只属于 Quick Entry。</text><line x1="48" y1="900" x2="1352" y2="900" stroke="#d6d2c7" stroke-width="1"/><text id="t40" x="48" y="943" fill="#24231f" font-size="24" font-weight="650" text-anchor="start" >C  Card：填充层与内容层分开，链接层补足交互</text><rect x="1070" y="920" width="250" height="32" rx="16" fill="#e6e2d6" fill-opacity="1" stroke="none" stroke-width="1" /><text id="t41" x="1084" y="942" fill="#5f5d55" font-size="16" font-weight="500" text-anchor="start" >C07 + card_*</text><rect x="74" y="978" width="540" height="192" rx="19" fill="none" fill-opacity="1" stroke="#a8a293" stroke-width="1.5" /><rect x="102" y="1001" width="540" height="192" rx="19" fill="#fcfcfb" fill-opacity="1" stroke="#c8c3b7" stroke-width="1" /><rect x="132" y="1027" width="540" height="143" rx="15" fill="#ffffff" fill-opacity="1" stroke="#c8c3b7" stroke-width="1" /><text id="t42" x="156" y="1062" fill="#24231f" font-size="21" font-weight="600" text-anchor="start" >内容主体 · cds-card-body</text><text id="t43" x="156" y="1098" fill="#5f5d55" font-size="19" font-weight="400" text-anchor="start" >示例文件 / 结果标题</text><text id="t44" x="156" y="1126" fill="#5f5d55" font-size="19" font-weight="400" text-anchor="start" >元信息与独立内容</text><rect x="132" y="1027" width="540" height="143" rx="15" fill="none" fill-opacity="1" stroke="#245b7c" stroke-width="2" stroke-dasharray="8 6" /><circle cx="78" cy="975" r="15" fill="#245b7c"/><text id="t45" x="78" y="981" fill="#ffffff" font-size="17" font-weight="650" text-anchor="middle" >1</text><circle cx="107" cy="1000" r="15" fill="#245b7c"/><text id="t46" x="107" y="1006" fill="#ffffff" font-size="17" font-weight="650" text-anchor="middle" >2</text><circle cx="136" cy="1026" r="15" fill="#245b7c"/><text id="t47" x="136" y="1032" fill="#ffffff" font-size="17" font-weight="650" text-anchor="middle" >3</text><circle cx="673" cy="1051" r="15" fill="#245b7c"/><text id="t48" x="673" y="1057" fill="#ffffff" font-size="17" font-weight="650" text-anchor="middle" >4</text><text id="t49" x="729" y="987" fill="#24231f" font-size="19" font-weight="400" text-anchor="start" >1  圆角外轮廓：焦点表达位于卡片边界</text><text id="t50" x="729" y="1022" fill="#24231f" font-size="19" font-weight="400" text-anchor="start" >2  装饰填充：常态 surface-1</text><text id="t51" x="729" y="1057" fill="#24231f" font-size="19" font-weight="400" text-anchor="start" >3  带内边距的内容主体</text><text id="t52" x="729" y="1092" fill="#24231f" font-size="19" font-weight="400" text-anchor="start" >4  CardLink 覆盖层（蓝色虚线为示意）</text><text id="t53" x="729" y="1145" fill="#5f5d55" font-size="18" font-weight="400" text-anchor="start" >含 CardLink 的 hover → surface-2；</text><text id="t54" x="729" y="1173" fill="#5f5d55" font-size="18" font-weight="400" text-anchor="start" >按下同步调整填充缩放与内容裁切。</text><line x1="48" y1="1237" x2="1352" y2="1237" stroke="#d6d2c7" stroke-width="1"/><text id="t55" x="48" y="1265" fill="#5f5d55" font-size="17" font-weight="400" text-anchor="start" >读图边界：官方 A1 / A2 只支持两层 composer 与单行入口的视觉关系；包内 C05–C12 提供结构与状态锚点。</text><text id="t56" x="48" y="1291" fill="#5f5d55" font-size="17" font-weight="400" text-anchor="start" >Card 是通用原语，不能据此声称已恢复全部文件 / 工具结果组件。阴影与爆炸层偏移均为本图原创表达。</text></svg>