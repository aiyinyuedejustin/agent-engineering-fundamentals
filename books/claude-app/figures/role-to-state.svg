<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="title"><title id="title">色阶、语义、组件、状态四层关系</title><style>text{font-family:system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1160" height="500" rx="0" fill="#f9f9f7" stroke="none"/><text x="40" y="48" fill="#20201f" font-size="27" font-weight="650">先分职责，再选颜色</text><text x="40" y="80" fill="#52514e" font-size="15" font-weight="400">从色阶到状态的设计方法；下面的组件组合是原创教学示意</text><rect x="40" y="122" width="250" height="166" rx="16" fill="#ffffff" stroke="#d7d5cd"/><text x="58" y="155" fill="#8f4831" font-size="15" font-weight="600">01</text><text x="58" y="188" fill="#20201f" font-size="23" font-weight="600">原始色阶</text><text x="58" y="223" fill="#20201f" font-size="14" font-weight="400">中性灰 / 品牌 / 状态色</text><text x="58" y="260" fill="#52514e" font-size="13" font-weight="400">事实：包内有多组色阶</text><text x="293" y="207" fill="#52514e" font-size="21" font-weight="400">→</text><rect x="315" y="122" width="250" height="166" rx="16" fill="#ffffff" stroke="#d7d5cd"/><text x="333" y="155" fill="#8f4831" font-size="15" font-weight="600">02</text><text x="333" y="188" fill="#20201f" font-size="23" font-weight="600">语义角色</text><text x="333" y="223" fill="#20201f" font-size="14" font-weight="400">画布 / 文字 / 边界 / 强调</text><text x="333" y="260" fill="#52514e" font-size="13" font-weight="400">决策：这层承担什么职责</text><text x="568" y="207" fill="#52514e" font-size="21" font-weight="400">→</text><rect x="590" y="122" width="250" height="166" rx="16" fill="#ffffff" stroke="#d7d5cd"/><text x="608" y="155" fill="#8f4831" font-size="15" font-weight="600">03</text><text x="608" y="188" fill="#20201f" font-size="23" font-weight="600">组件结构</text><text x="608" y="223" fill="#20201f" font-size="14" font-weight="400">输入 / 附件 / 工具 / 提交</text><text x="608" y="260" fill="#52514e" font-size="13" font-weight="400">决策：如何组合与对齐</text><text x="843" y="207" fill="#52514e" font-size="21" font-weight="400">→</text><rect x="865" y="122" width="250" height="166" rx="16" fill="#ffffff" stroke="#d7d5cd"/><text x="883" y="155" fill="#8f4831" font-size="15" font-weight="600">04</text><text x="883" y="188" fill="#20201f" font-size="23" font-weight="600">交互状态</text><text x="883" y="223" fill="#20201f" font-size="14" font-weight="400">默认 / 聚焦 / 忙碌 / 错误</text><text x="883" y="260" fill="#52514e" font-size="13" font-weight="400">决策：变化后如何辨识</text><rect x="40" y="325" width="1080" height="128" rx="14" fill="#eeede8" stroke="none"/><text x="62" y="360" fill="#20201f" font-size="22" font-weight="600">一个橙色按钮，不能定义一套设计系统。</text><text x="62" y="395" fill="#20201f" font-size="17" font-weight="400">先确定按钮的任务、状态和层级，再决定填色、字号、触达范围与反馈。</text><text x="62" y="426" fill="#52514e" font-size="16" font-weight="400">复用这些关系；把自己的适配值与观察到的产品值分开记录。</text></svg>