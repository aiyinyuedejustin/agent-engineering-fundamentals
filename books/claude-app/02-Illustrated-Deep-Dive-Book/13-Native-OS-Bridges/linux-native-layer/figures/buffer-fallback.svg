<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 425" role="img" aria-labelledby="title desc"><title id="title">局部机器码关系：外部 Buffer 拒绝后的复制分支</title><desc id="desc">原创静态证据图；图例与正文区分实际观察和工程建议。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546e89"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans",sans-serif;fill:#24364b} .title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.note{font-size:17px;fill:#54687e}.code{font-family:monospace;font-size:17px}.arrow{fill:none;stroke:#546e89;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="1120" height="425" rx="18" fill="#f8fafc"/><text x="36" y="48" class="title">局部机器码关系：外部 Buffer 拒绝后的复制分支</text>
<rect x="36" y="110" width="323" height="112" rx="12" fill="#e5f1ee" stroke="#c5d3e2"/>
<text x="54" y="143" class="label">尝试外部 Buffer</text>
<text x="54" y="173" class="small">napi_create_external_buffer</text>
<text x="54" y="200" class="small">先观察返回状态</text>
<rect x="416" y="110" width="273" height="112" rx="12" fill="#eaf0f7" stroke="#c5d3e2"/>
<text x="434" y="143" class="label">状态是否为 0x16？</text>
<text x="434" y="173" class="small">十进制 22</text>
<text x="434" y="200" class="small">对应不允许 external Buffer</text>
<rect x="756" y="110" width="328" height="112" rx="12" fill="#eaf0f7" stroke="#c5d3e2"/>
<text x="774" y="143" class="label">其余状态的后续处理</text>
<text x="774" y="173" class="small">包含成功或其他错误</text>
<text x="774" y="200" class="small">本图不把它们统称为成功</text>
<path d="M 359 165 L 416 165" class="arrow"/>
<path d="M 689 165 L 756 165" class="arrow"/>
<text x="710" y="148" class="small">否</text>
<rect x="416" y="279" width="475" height="85" rx="12" fill="#e5f1ee" stroke="#c5d3e2"/>
<text x="434" y="312" class="label">转用复制 Buffer</text>
<text x="434" y="342" class="small">napi_create_buffer_copy</text>
<path d="M 551 222 L 551 279" class="arrow"/>
<text x="568" y="254" class="small">是</text>
<text x="36" y="398" class="note">观察到静态条件分支；未证明运行时走过，也未把通用绑定兼容代码归为专有优化。</text>
</svg>
