<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">Desktop networking has several owners</title><desc id="desc">Three static call chains distinguish Chromium sessions, Node WebSocket options, and child-process environments. No live network or process trace was captured.</desc>
<rect width="1120" height="770" fill="#f7f4ee"/>
<g font-family="sans-serif" fill="#252b35">
<text x="40" y="48" font-size="27" font-weight="700">One desktop shell, several network boundaries</text>
<text x="40" y="77" font-size="16">Linux 2.37337.1 · original static diagram · not a socket/PID trace</text>
<rect x="35" y="110" width="1050" height="175" rx="13" fill="#fff" stroke="#bcb7ad"/>
<text x="55" y="140" font-size="20" font-weight="700">Bridge connector / main-process caller</text>
<text x="55" y="167" font-size="16">flag + forceWs → transport factory</text>
<rect x="55" y="185" width="485" height="78" rx="8" fill="#e1edf4"/>
<text x="70" y="215" font-size="19" font-weight="700">Chromium net.WebSocket</text>
<text x="70" y="242" font-size="15">Session: claude-bridge-ws</text>
<rect x="565" y="185" width="485" height="78" rx="8" fill="#eee5f3"/>
<text x="580" y="215" font-size="19" font-weight="700">Node ws</text>
<text x="580" y="242" font-size="15">Conditional TLS options / proxy agent</text>
<rect x="35" y="305" width="1050" height="175" rx="13" fill="#fff" stroke="#bcb7ad"/>
<text x="55" y="335" font-size="20" font-weight="700">Node MCP transport / main-process launcher</text>
<text x="55" y="362" font-size="16">resolve proxy + build CA options → merge env</text>
<rect x="55" y="380" width="485" height="78" rx="8" fill="#e1edf4"/>
<text x="70" y="410" font-size="19" font-weight="700">utilityProcess.fork</text>
<text x="70" y="437" font-size="15">Child loads service entrypoint</text>
<rect x="565" y="380" width="485" height="78" rx="8" fill="#eee5f3"/>
<text x="580" y="410" font-size="19" font-weight="700">Service-defined networking</text>
<text x="580" y="437" font-size="15">Environment is configuration, not a Session</text>
<rect x="35" y="500" width="1050" height="175" rx="13" fill="#fff" stroke="#bcb7ad"/>
<text x="55" y="530" font-size="20" font-weight="700">Preview / artifact / pairing policies</text>
<text x="55" y="557" font-size="16">dedicated Session → local rules</text>
<rect x="55" y="575" width="485" height="78" rx="8" fill="#e1edf4"/>
<text x="70" y="605" font-size="19" font-weight="700">Preview + artifact</text>
<text x="70" y="632" font-size="15">Proxy-answer check before selected navigation</text>
<rect x="565" y="575" width="485" height="78" rx="8" fill="#eee5f3"/>
<text x="580" y="605" font-size="19" font-weight="700">Local pairing fetch</text>
<text x="580" y="632" font-size="15">Session fetch + certificate callback</text>
<text x="40" y="724" font-size="16">A proxy setter is not a global egress proof. A child env is not a browser cookie jar.</text>
<text x="40" y="750" font-size="14">Evidence NW01–39 · adapters and lifecycle paths are static; flags and live configuration remain unknown.</text>
</g></svg>