<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">等待期限与底层任务是两条生命周期</title><desc id="desc">到期只让等待者返回 deadline。随后发出 abort，但忽略信号的任务在 gate 放行后仍写入一次。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#596262"/></marker></defs><rect width="1200" height="650" fill="#f8f6f0"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="42" y="56" font-size="30" font-weight="700" fill="#252b2b">期限到了，等待者返回；任务可能仍在继续</text><text x="42" y="91" font-size="18" font-weight="400" fill="#596262">原创教学图 · 下方任务故意忽略取消信号，帮助观察两条生命周期</text><text x="196" y="145" font-size="18" font-weight="400" fill="#596262">t0 启动</text><path d="M230,160 L230,437" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="456" y="145" font-size="18" font-weight="400" fill="#596262">t1 deadline</text><path d="M490,160 L490,437" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="706" y="145" font-size="18" font-weight="400" fill="#596262">t2 abort</text><path d="M740,160 L740,437" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="976" y="145" font-size="18" font-weight="400" fill="#596262">t3 gate 放行</text><path d="M1010,160 L1010,437" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="42" y="211" font-size="21" font-weight="600" fill="#252b2b">等待者</text><path d="M230,210 L490,210" fill="none" stroke="#2c5f7c" stroke-width="6"/><circle cx="230" cy="210" r="6" fill="#2c5f7c"/><circle cx="490" cy="210" r="6" fill="#2c5f7c"/><text x="280" y="194" font-size="19" font-weight="400" fill="#2c5f7c">等待结果</text><rect x="523" y="174" width="590" height="78" rx="14" fill="#e6eff4" stroke="#2c5f7c"/><text x="544" y="205" font-size="22" font-weight="600" fill="#2c5f7c">返回 { kind: &quot;deadline&quot; }</text><text x="544" y="234" font-size="18" font-weight="400" fill="#2c5f7c">此后原报告不因任务晚完成而改写</text><text x="42" y="330" font-size="21" font-weight="600" fill="#252b2b">底层任务</text><path d="M230,330 L1010,330" fill="none" stroke="#356756" stroke-width="6"/><circle cx="230" cy="330" r="6" fill="#356756"/><circle cx="1010" cy="330" r="6" fill="#356756"/><text x="287" y="312" font-size="20" font-weight="400" fill="#356756">等待 gate，任务仍活着</text><text x="673" y="371" font-size="18" font-weight="400" fill="#9d4935">信号已发出</text><text x="673" y="400" font-size="18" font-weight="400" fill="#9d4935">任务未配合停止</text><rect x="950" y="283" width="177" height="65" rx="14" fill="#e6efe9" stroke="#356756"/><text x="973" y="324" font-size="23" font-weight="700" fill="#356756">write × 1</text><rect x="42" y="448" width="1083" height="142" rx="14" fill="#fff" stroke="#c9cec9"/><text x="65" y="486" font-size="23" font-weight="700" fill="#252b2b">Promise.race 只选竞争结果，不包含“停止输家”的步骤。</text><text x="65" y="524" font-size="20" font-weight="400" fill="#252b2b">abort 是取消请求；只有任务观察信号并配合，才能阻止尚未提交的工作。</text><text x="65" y="560" font-size="20" font-weight="400" fill="#252b2b">已提交的副作用不会自动回滚。因此，超时本身也不能证明重试安全。</text><text x="42" y="625" font-size="17" font-weight="400" fill="#596262">实验对应：waitUntil / effectAfter · 对照 cooperative=false 与 true。</text></g></svg>