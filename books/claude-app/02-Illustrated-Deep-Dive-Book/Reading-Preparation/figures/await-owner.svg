<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">await 前后必须重新检查当前归属</title><desc id="desc">原创逻辑时间线。任务 A 持有旧票据；页面变为 B 后，A 的迟到结果只能被丢弃。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#596262"/></marker></defs><rect width="1200" height="650" fill="#f8f6f0"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="42" y="56" font-size="30" font-weight="700" fill="#252b2b">await 让出执行权，当前归属仍可改变</text><text x="42" y="91" font-size="18" font-weight="400" fill="#596262">原创教学图 · t0—t3 表示先后顺序，不是运行耗时</text><text x="205" y="145" font-size="18" font-weight="400" fill="#596262">t0 保存票据</text><path d="M240,160 L240,455" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="435" y="145" font-size="18" font-weight="400" fill="#596262">t1 切换页面</text><path d="M470,160 L470,455" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="665" y="145" font-size="18" font-weight="400" fill="#596262">t2 读取完成</text><path d="M700,160 L700,455" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="895" y="145" font-size="18" font-weight="400" fill="#596262">t3 恢复并检查</text><path d="M930,160 L930,455" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="42" y="214" font-size="21" font-weight="600" fill="#252b2b">当前归属</text><rect x="195" y="178" width="190" height="66" rx="14" fill="#e6eff4" stroke="#2c5f7c"/><text x="222" y="220" font-size="21" font-weight="600" fill="#2c5f7c">A  ·  ticket A</text><path d="M386,210 L440,210" fill="none" stroke="#596262" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="178" width="685" height="66" rx="14" fill="#f4e4dc" stroke="#9d4935"/><text x="464" y="220" font-size="21" font-weight="600" fill="#9d4935">B  ·  新 ticket B 始终保持为当前票据</text><text x="42" y="330" font-size="21" font-weight="600" fill="#252b2b">A 的工作</text><rect x="195" y="279" width="215" height="91" rx="14" fill="#fff" stroke="#c9cec9"/><text x="214" y="314" font-size="20" font-weight="600" fill="#2c5f7c">保留 ticket A</text><text x="214" y="344" font-size="18" font-weight="400" fill="#596262">进入 await</text><path d="M410,325 L669,325" fill="none" stroke="#2c5f7c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="457" y="306" font-size="17" font-weight="400" fill="#2c5f7c">暂停，其他代码可运行</text><circle cx="700" cy="325" r="6" fill="#2c5f7c"/><text x="658" y="369" font-size="18" font-weight="400" fill="#2c5f7c">结果到达</text><path d="M712,325 L865,325" fill="none" stroke="#596262" stroke-width="2" marker-end="url(#arrow)"/><rect x="865" y="279" width="260" height="91" rx="14" fill="#e6efe9" stroke="#356756"/><text x="884" y="314" font-size="20" font-weight="600" fill="#356756">A !== 当前 B</text><text x="884" y="344" font-size="18" font-weight="400" fill="#356756">返回 stale，不写入</text><rect x="42" y="424" width="1083" height="166" rx="14" fill="#fff" stroke="#c9cec9"/><text x="65" y="462" font-size="23" font-weight="700" fill="#9d4935">省略检查会怎样？</text><text x="65" y="500" font-size="20" font-weight="400" fill="#252b2b">界面仍属于 B，却被写入 result:A。旧结果覆盖新状态，不需要并行线程。</text><text x="65" y="539" font-size="20" font-weight="400" fill="#252b2b">检查应靠近交付；检查之后再出现 await，就又留下可交错的空隙。</text><text x="42" y="625" font-size="17" font-weight="400" fill="#596262">实验对应：commitAfter · guarded=false 复现覆盖；guarded=true 拒绝旧结果。</text></g></svg>