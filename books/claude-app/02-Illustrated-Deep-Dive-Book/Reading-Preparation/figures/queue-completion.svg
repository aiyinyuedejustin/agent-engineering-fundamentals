<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">入队成功与操作结算属于不同的 Promise</title><desc id="desc">enqueue 返回 accepted 收据时操作尚未开始。runNext 启动任务，receipt.completion 在任务成功或失败后才结算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#596262"/></marker></defs><rect width="1200" height="700" fill="#f8f6f0"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="42" y="56" font-size="30" font-weight="700" fill="#252b2b">两个 Promise，回答两个不同的问题</text><text x="42" y="91" font-size="18" font-weight="400" fill="#596262">原创教学图 · 本例契约：enqueue 接收入队；receipt.completion 返回操作结算</text><text x="200" y="145" font-size="18" font-weight="400" fill="#596262">t0 入队</text><path d="M235,160 L235,460" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="465" y="145" font-size="18" font-weight="400" fill="#596262">t1 启动</text><path d="M500,160 L500,460" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="725" y="145" font-size="18" font-weight="400" fill="#596262">t2 放行</text><path d="M760,160 L760,460" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="990" y="145" font-size="18" font-weight="400" fill="#596262">t3 结算</text><path d="M1025,160 L1025,460" fill="none" stroke="#c9cec9" stroke-width="2" stroke-dasharray="8 6"/><text x="42" y="213" font-size="20" font-weight="600" fill="#252b2b">入队 Promise</text><circle cx="235" cy="210" r="6" fill="#2c5f7c"/><rect x="265" y="177" width="378" height="70" rx="14" fill="#e6eff4" stroke="#2c5f7c"/><text x="285" y="205" font-size="20" font-weight="600" fill="#2c5f7c">已 fulfilled：accepted=true</text><text x="285" y="233" font-size="16" font-weight="400" fill="#2c5f7c">只证明本例已把任务放入内存队列</text><text x="42" y="331" font-size="20" font-weight="600" fill="#252b2b">操作状态</text><rect x="218" y="280" width="245" height="78" rx="14" fill="#f0eee7" stroke="#c9cec9"/><text x="239" y="312" font-size="23" font-weight="600" fill="#252b2b">queued</text><text x="239" y="340" font-size="18" font-weight="400" fill="#596262">等待执行者取出</text><path d="M463,320 L485,320" fill="none" stroke="#596262" stroke-width="2" marker-end="url(#arrow)"/><rect x="487" y="280" width="447" height="78" rx="14" fill="#f4e4dc" stroke="#9d4935"/><text x="508" y="312" font-size="23" font-weight="600" fill="#9d4935">running</text><text x="508" y="340" font-size="18" font-weight="400" fill="#9d4935">已启动 → 等待 gate → 继续保存</text><path d="M934,320 L961,320" fill="none" stroke="#596262" stroke-width="2" marker-end="url(#arrow)"/><rect x="963" y="280" width="190" height="78" rx="14" fill="#e6efe9" stroke="#356756"/><text x="982" y="312" font-size="23" font-weight="600" fill="#356756">fulfilled</text><text x="982" y="340" font-size="16" font-weight="400" fill="#356756">也可能 rejected</text><text x="42" y="429" font-size="20" font-weight="600" fill="#252b2b">操作 Promise</text><path d="M235,430 L1025,430" fill="none" stroke="#356756" stroke-width="6"/><circle cx="235" cy="430" r="6" fill="#356756"/><circle cx="1025" cy="430" r="6" fill="#356756"/><text x="400" y="412" font-size="20" font-weight="400" fill="#356756">receipt.completion 一直等待操作结算</text><text x="856" y="466" font-size="18" font-weight="400" fill="#356756">这里才得到结果记录</text><rect x="42" y="499" width="1111" height="133" rx="14" fill="#fff" stroke="#c9cec9"/><text x="65" y="536" font-size="24" font-weight="700" fill="#252b2b">await 只等待你给它的那个 Promise。</text><text x="65" y="575" font-size="19" font-weight="400" fill="#252b2b">如果等的是 enqueue，本例只能显示“已排队”；若要确认保存结果，继续等 completion。</text><text x="65" y="610" font-size="19" font-weight="400" fill="#252b2b">真实 API 也可能选择另一种返回契约：追踪 resolve / reject，不能只猜函数名。</text><text x="42" y="671" font-size="17" font-weight="400" fill="#596262">实验对应：TeachingQueue · runNext 手动启动单个任务；没有真实磁盘或持久队列。</text></g></svg>