<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="950" viewBox="0 0 1380 950" role="img" aria-labelledby="title desc">
<title id="title">字、间距、圆角与焦点环</title><desc id="desc">展示实际字体回退、字号、间距阶梯、圆角和焦点环。</desc>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:Consolas,monospace}</style>
<rect x="0" y="0" width="1380" height="950" rx="0" fill="#f8f7f3"/>
<text x="40" y="56" font-size="30" fill="#26251f" font-weight="700">字、间距、圆角与焦点环</text>
<text x="40" y="90" font-size="17" fill="#656258" font-weight="400">以下尺寸来自模板共享变量与基础样式。</text>
<rect x="40" y="124" width="1300" height="103" rx="14" fill="#ffffff" stroke="#d9d6cc" stroke-width="1"/>
<text x="60" y="155" font-size="15" fill="#656258" font-weight="400">界面工具字</text>
<text x="60" y="196" font-size="28" fill="#26251f" font-weight="400" style="font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif">Clear controls · 清楚的控件</text>
<text x="700" y="189" font-size="18" fill="#26251f" font-weight="400">14px / 1.6 · 紧凑 13px</text>
<rect x="40" y="244" width="1300" height="103" rx="14" fill="#ffffff" stroke="#d9d6cc" stroke-width="1"/>
<text x="60" y="275" font-size="15" fill="#656258" font-weight="400">长文阅读字</text>
<text x="60" y="316" font-size="28" fill="#26251f" font-weight="400" style="font-family:Georgia, &quot;Times New Roman&quot;, &quot;Songti SC&quot;, &quot;STSong&quot;, serif">Ideas deserve room · 给文字留出呼吸</text>
<text x="700" y="309" font-size="18" fill="#26251f" font-weight="400">18px / 1.85 · 大字 21px</text>
<rect x="40" y="364" width="1300" height="103" rx="14" fill="#ffffff" stroke="#d9d6cc" stroke-width="1"/>
<text x="60" y="395" font-size="15" fill="#656258" font-weight="400">代码与数字</text>
<text x="60" y="436" font-size="28" fill="#26251f" font-weight="400" style="font-family:&quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace">const scale = [4, 8, 12, 16];</text>
<text x="700" y="429" font-size="18" fill="#26251f" font-weight="400">SFMono-Regular → Consolas → Liberation Mono</text>
<text x="40" y="535" font-size="22" fill="#26251f" font-weight="600">间距阶梯</text>
<rect x="40" y="562" width="128" height="90" rx="8" fill="#ffffff" stroke="#d9d6cc" stroke-width="1"/>
<rect x="50" y="574" width="4" height="54" rx="3" fill="#a24b33"/>
