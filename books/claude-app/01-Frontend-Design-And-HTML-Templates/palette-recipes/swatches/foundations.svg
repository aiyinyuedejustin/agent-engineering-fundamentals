<text x="850" y="643" font-size="13" fill="#26251f" font-weight="400">32px  ·  space-6</text>
<rect x="1000" y="562" width="128" height="90" rx="8" fill="#ffffff" stroke="#d9d6cc" stroke-width="1"/>
<rect x="1010" y="574" width="48" height="54" rx="3" fill="#a24b33"/>
<text x="1010" y="643" font-size="13" fill="#26251f" font-weight="400">48px  ·  space-7</text>
<rect x="1160" y="562" width="128" height="90" rx="8" fill="#ffffff" stroke="#d9d6cc" stroke-width="1"/>
<rect x="1170" y="574" width="72" height="54" rx="3" fill="#a24b33"/>
<text x="1170" y="643" font-size="13" fill="#26251f" font-weight="400">72px  ·  space-8</text>
<text x="40" y="706" font-size="22" fill="#26251f" font-weight="600">三个圆角</text>
<rect x="40" y="738" width="184" height="100" rx="8" fill="#ffffff" stroke="#878273" stroke-width="1"/>
<text x="56" y="785" font-size="18" fill="#26251f" font-weight="600">control</text>
<text x="56" y="815" font-size="16" fill="#656258" font-weight="400">8px</text>
<rect x="260" y="738" width="184" height="100" rx="14" fill="#ffffff" stroke="#878273" stroke-width="1"/>
<text x="276" y="785" font-size="18" fill="#26251f" font-weight="600">card</text>
<text x="276" y="815" font-size="16" fill="#656258" font-weight="400">14px</text>
<rect x="480" y="738" width="184" height="100" rx="20" fill="#ffffff" stroke="#878273" stroke-width="1"/>
<text x="496" y="785" font-size="18" fill="#26251f" font-weight="600">composer</text>
<text x="496" y="815" font-size="16" fill="#656258" font-weight="400">20px</text>
<text x="750" y="706" font-size="22" fill="#26251f" font-weight="600">可见的键盘焦点</text>
<rect x="750" y="743" width="194" height="54" rx="13" fill="none" stroke="#a24b33" stroke-width="2"/>
<rect x="755" y="748" width="184" height="44" rx="8" fill="#ffffff" stroke="#878273" stroke-width="1"/>
<text x="775" y="777" font-size="17" fill="#26251f" font-weight="400">Tab 聚焦</text>
<text x="970" y="768" font-size="17" fill="#26251f" font-weight="400">2px accent 外轮廓</text>
<text x="970" y="798" font-size="17" fill="#26251f" font-weight="400">与边界保持 4px 间隔</text>
<text x="40" y="900" font-size="15" fill="#656258" font-weight="400">字体只使用本机回退；未打包专有字体。图示字形受查看设备字体影响。</text>
</svg>
