<text x="690" y="643" font-size="13" fill="#26251f" font-weight="400">24px  ·  space-5</text>
<rect x="840" y="562" width="128" height="90" rx="8" fill="#ffffff" stroke="#d9d6cc" stroke-width="1"/>
