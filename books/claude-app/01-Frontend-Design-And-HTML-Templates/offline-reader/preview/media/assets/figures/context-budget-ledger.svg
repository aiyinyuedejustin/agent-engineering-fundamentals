<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="704" viewBox="0 0 1120 704" role="img" aria-labelledby="title desc">
<title id="title">预算必须计算尚未完成的承诺</title><desc id="desc">深色 = 已提交 U；蓝色 = 在途预留 R；空格 = 剩余额度。</desc>
<style>text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
<rect width="1120" height="704" fill="#f7f5ef" />
<text x="36" y="48" font-size="28" fill="#252a30" font-weight="700">预算必须计算尚未完成的承诺</text>
<text x="36" y="80" font-size="16" fill="#58616a" font-weight="400">深色 = 已提交 U；蓝色 = 在途预留 R；空格 = 剩余额度。</text>
<text x="36" y="125" font-size="18" fill="#252a30" font-weight="400">总预算 12 字节；已有文本 ok = 2，附件 A / B 各为 6 个 UTF-8 字节。</text><rect x="36" y="146" width="1048" height="42" rx="10" fill="#e9e6dd" stroke="#c7cbc9" /><text x="50" y="175" font-size="17" fill="#252a30" font-weight="700">步骤</text><text x="390" y="175" font-size="17" fill="#252a30" font-weight="700">账本占用（每格 1 字节）</text><text x="840" y="175" font-size="17" fill="#252a30" font-weight="700">U / R</text><text x="50" y="229" font-size="18" fill="#252a30" font-weight="400">初始：已有 ok</text><rect x="390" y="202" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="422" y="202" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="454" y="202" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="486" y="202" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="518" y="202" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="550" y="202" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="582" y="202" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="614" y="202" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="646" y="202" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="678" y="202" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="710" y="202" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="742" y="202" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><text x="840" y="229" font-size="18" fill="#252a30" font-weight="400">2 / 0</text><text x="50" y="287" font-size="18" fill="#252a30" font-weight="400">A 预留 6 字节</text><rect x="390" y="260" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="422" y="260" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="454" y="260" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="486" y="260" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="518" y="260" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="550" y="260" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="582" y="260" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="614" y="260" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="646" y="260" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="678" y="260" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="710" y="260" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="742" y="260" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><text x="840" y="287" font-size="18" fill="#252a30" font-weight="400">2 / 6</text><text x="50" y="345" font-size="18" fill="#252a30" font-weight="400">B 也要 6：拒绝内联</text><rect x="390" y="318" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="422" y="318" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="454" y="318" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="486" y="318" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="518" y="318" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="550" y="318" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="582" y="318" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="614" y="318" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="646" y="318" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="678" y="318" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="710" y="318" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="742" y="318" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><text x="840" y="345" font-size="18" fill="#252a30" font-weight="400">2 / 6</text><text x="50" y="403" font-size="18" fill="#252a30" font-weight="400">A 取消：释放预留</text><rect x="390" y="376" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="422" y="376" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="454" y="376" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="486" y="376" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="518" y="376" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="550" y="376" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="582" y="376" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="614" y="376" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="646" y="376" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="678" y="376" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="710" y="376" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="742" y="376" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><text x="840" y="403" font-size="18" fill="#252a30" font-weight="400">2 / 0</text><text x="50" y="461" font-size="18" fill="#252a30" font-weight="400">B 重试：重新预留</text><rect x="390" y="434" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="422" y="434" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="454" y="434" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="486" y="434" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="518" y="434" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="550" y="434" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="582" y="434" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="614" y="434" width="28" height="31" rx="3" fill="#76a9d1" stroke="#c7cbc9" /><rect x="646" y="434" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="678" y="434" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="710" y="434" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="742" y="434" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><text x="840" y="461" font-size="18" fill="#252a30" font-weight="400">2 / 6</text><text x="50" y="519" font-size="18" fill="#252a30" font-weight="400">B 提交：额度转移</text><rect x="390" y="492" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="422" y="492" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="454" y="492" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="486" y="492" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="518" y="492" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="550" y="492" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="582" y="492" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="614" y="492" width="28" height="31" rx="3" fill="#364b5b" stroke="#c7cbc9" /><rect x="646" y="492" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="678" y="492" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="710" y="492" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><rect x="742" y="492" width="28" height="31" rx="3" fill="#fff" stroke="#c7cbc9" /><text x="840" y="519" font-size="18" fill="#252a30" font-weight="400">8 / 0</text><rect x="36" y="566" width="1048" height="88" rx="10" fill="#fff" stroke="#c7cbc9" /><text x="54" y="595" font-size="18" fill="#252a30" font-weight="700">两条独立不变量</text><text x="54" y="621" font-size="17" fill="#252a30" font-weight="400">预算：已提交 U + 在途预留 R ≤ 12。归属：只接受当前草稿代次的完成回调。</text><text x="54" y="646" font-size="17" fill="#252a30" font-weight="400">取消先释放预留；晚到回调再次检查代次。两者缺一，都会留下错误状态。</text>
<text x="36" y="682" font-size="14" fill="#58616a" font-weight="400">原创教学模型 · 合成事件与数值 · 不表示产品的真实运行测量</text>
</svg>