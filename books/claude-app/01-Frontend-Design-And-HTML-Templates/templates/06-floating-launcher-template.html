/* 有边界的 reset 与基础样式。仅作用于 data-ui="atelier" 容器及其子树。
 * 组件复用：导入 tokens 后导入本文件。它不全局重置第三方页面。
 * 原生语义优先：button、details、dialog、input 保留浏览器键盘行为。

:where([data-ui="atelier"]) :where(svg) { display: block; }
:where([data-ui="atelier"]) :where(:focus-visible) { outline: 2px solid var(--ui-accent); outline-offset: 4px; }

.launcher-home{max-width:1040px;margin:auto;padding:70px 40px 24px;min-height:calc(100dvh - 70px)}.launcher-greeting{max-width:590px}.launcher-greeting h1{font:48px/1.3 var(--ui-reading);letter-spacing:-1.5px;margin:20px 0}.launcher-greeting>p:not(.eyebrow){font:17px/1.8 var(--ui-reading);color:var(--ui-muted);margin-bottom:26px}.launcher-greeting .btn{gap:12px}.launcher-greeting kbd{background:transparent;color:inherit;border-color:var(--ui-line-strong);font-size:9px}.capture-area{margin-top:70px;max-width:780px;border-top:1px solid var(--ui-line);padding-top:22px}.capture-area h2{font-size:13px;font-weight:500;margin:0}.capture-area .empty{text-align:left;padding:32px 0;font-size:12px}.capture-entry{display:flex;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1px solid var(--ui-line)}.capture-entry p{font:17px/1.7 var(--ui-reading);margin:6px 0 8px;overflow-wrap:anywhere;white-space:pre-wrap}.capture-entry .btn{align-self:center;font-size:11px}.launcher-home-footer{display:flex;justify-content:space-between;font-size:10px;color:var(--ui-muted);margin-top:90px;padding-top:20px;border-top:1px solid var(--ui-line)}.launcher-dialog{width:min(680px,calc(100vw - 32px));padding:0;border:1px solid var(--ui-line-strong);border-radius:18px;background:var(--ui-surface);color:var(--ui-ink);box-shadow:0 28px 100px #00000025;max-height:calc(100dvh - 40px);overflow:auto;margin:auto}.launcher-dialog::backdrop{background:var(--ui-scrim);backdrop-filter:blur(5px)}.launcher-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 8px}.launcher-head .mark{width:23px;height:23px;font-size:16px}.launcher-head #launcher-title{font-size:11px;color:var(--ui-muted)}.launcher-head .btn{min-height:30px;width:30px}.launcher-head .icon{width:15px}.launcher-input-row{display:flex;align-items:center;gap:13px;padding:13px 25px}.launcher-input-row>svg{color:var(--ui-muted);width:22px;height:22px}.launcher-input-row input{min-width:0;flex:1;border:0;background:none;font-size:18px;min-height:42px}.launcher-input-row input:focus{outline:none}.launcher-input-row:focus-within{box-shadow:inset 3px 0 var(--ui-accent)}.launcher-input-row .icon-btn{width:34px;min-height:34px}.launcher-context{display:flex;align-items:center;gap:8px;margin:0 25px;padding:3px 0 18px;border-bottom:1px solid var(--ui-line);font-size:11px;color:var(--ui-muted)}.launcher-context select{font-size:11px;padding:4px 20px 4px 8px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-canvas);max-width:170px;min-height:30px}.launcher-context .badge{margin-left:auto;font-size:9px}.command-area{padding:20px 13px 15px}.command-area>.eyebrow{padding:0 13px;font-size:9px;margin-bottom:11px}.command-option{display:flex;align-items:center;gap:13px;padding:12px 13px;border-radius:8px;cursor:pointer;margin-bottom:3px}.command-option[aria-selected=true]{background:var(--ui-sidebar)}.command-symbol{height:34px;width:34px;display:grid;place-items:center;border:1px solid var(--ui-line);border-radius:7px;background:var(--ui-surface);font-size:19px;color:var(--ui-muted)}.command-copy{flex:1;min-width:0}.command-copy strong{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.command-copy span{display:block;font-size:10px;color:var(--ui-muted);margin-top:3px}.command-option>kbd{font-size:10px;flex-shrink:0}.launcher-footer{display:flex;justify-content:space-between;gap:15px;padding:14px 25px;background:var(--ui-canvas);border-top:1px solid var(--ui-line);font-size:9px;color:var(--ui-muted)}.launcher-footer kbd{font-size:9px;margin-right:3px}.launcher-dialog .empty{padding:10px;font-size:12px}@media(max-width:600px){.launcher-home{padding:45px 22px 20px}.launcher-greeting h1{font-size:38px}.launcher-home-footer{gap:15px;flex-direction:column}.launcher-dialog{width:calc(100vw - 20px);border-radius:15px;max-height:calc(100dvh - 24px)}.launcher-head{padding:12px 14px 5px}.launcher-input-row{padding:10px 17px;gap:9px}.launcher-input-row input{font-size:16px}.launcher-context{margin-inline:18px}.command-area{padding-inline:8px}.command-option{padding:11px 10px;gap:10px}.launcher-footer{padding:13px 18px}.capture-entry{gap:10px}.capture-entry p{font-size:16px}.command-option>kbd{display:none}}
</style></head><body>
<a class="skip btn" href="#main">跳到主要内容</a>
<header class="topbar"><a class="brand" href="#main" style="text-decoration:none"><span class="mark" aria-hidden="true">a</span>留白 <span class="muted small" style="font-weight:400;letter-spacing:1px">atelier</span></a><span class="crumb">06 / QUICK ENTRY</span><div class="tools"><label class="sr-only" for="palette">原创配色</label><select id="palette" class="palette-select"><option value="paper">纸与陶</option><option value="sage">苔绿</option><option value="ocean">雾蓝</option><option value="plum">梅灰</option><option value="graphite">石墨</option></select><button class="btn quiet icon-btn" id="theme-toggle" aria-label="切换到深色主题" title="切换主题"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></svg></button></div></header><main id="main" class="launcher-home" tabindex="-1"><header class="launcher-greeting"><p class="eyebrow">A PLACE FOR YOUR NEXT THOUGHT</p><h1>好想法，<br>不必等到坐下来。</h1><p>打开轻入口，把念头接住，再回到正在做的事。</p><button class="btn primary" id="open-launcher"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 8H5a3 3 0 1 1 3-3v14a3 3 0 1 1-3-3h14a3 3 0 1 1-3 3V5a3 3 0 1 1 3 3H8Z"/></svg>打开轻入口 <kbd>⌘ / Ctrl K</kbd></button></header><div class="capture-area"><div class="row between"><h2>刚刚记下</h2><span class="badge" id="capture-count">0 条</span></div><div id="captures"><div class="empty">这里会放下你刚刚捕捉的想法。</div></div></div><footer class="launcher-home-footer"><span>一个短输入，一点新可能。</span><span>仅保存在当前浏览器</span></footer></main>
<dialog class="launcher-dialog" id="launcher-dialog" aria-labelledby="launcher-title"><header class="launcher-head"><div class="row"><span class="mark" aria-hidden="true">a</span><span id="launcher-title">下一步，从这里开始。</span></div><button class="btn quiet icon-btn" data-close-dialog aria-label="关闭轻入口"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header><form id="launcher-form"><div class="launcher-input-row"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><label class="sr-only" for="launcher-input">搜索命令或写下想法</label><input id="launcher-input" type="text" maxlength="2000" role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="command-list" autocomplete="off" placeholder="搜索命令，或者写下一个想法…"><button class="btn primary icon-btn" type="submit" id="capture-submit" aria-label="记录输入" disabled><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div><div class="launcher-context"><label for="capture-context">保存到</label><select id="capture-context"><option value="inbox">我的收件盒</option><option value="ideas">设计灵感</option><option value="project">当前项目</option></select><span class="badge"><i class="dot"></i>本地</span></div></form><div class="command-area"><p class="eyebrow" id="command-heading">QUICK ACTIONS</p><div id="command-list" role="listbox" aria-label="本地命令"></div><p id="command-status" class="sr-only" role="status"></p></div><footer class="launcher-footer"><span><kbd>↑</kbd> <kbd>↓</kbd> 选择 <kbd>Enter</kbd> 执行</span><span><kbd>Esc</kbd> 收起</span></footer></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>

'use strict';
// 这些辅助函数处理离线、file:// 与被禁用的存储；不假设剪贴板或持久化可用。
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => Array.from(root.querySelectorAll(s));
const root = document.documentElement;
const storage = {
 read(key, fallback) { try { const value=localStorage.getItem('atelier-'+key); return value===null?fallback:JSON.parse(value); } catch { return fallback; } },
 write(key, value) { try { localStorage.setItem('atelier-'+key,JSON.stringify(value)); return true; } catch { return false; } }
};
let toastTimer;
function toast(text) { const node=$('#toast'); node.textContent=text; node.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>node.hidden=true,4200); }
function setTheme(theme, persist=true) { if(!['light','dark'].includes(theme))return; root.dataset.theme=theme; const b=$('#theme-toggle'); if(b){b.setAttribute('aria-label',theme==='dark'?'切换到浅色主题':'切换到深色主题');b.setAttribute('aria-pressed',String(theme==='dark'));} if(persist&&!storage.write('theme',theme))toast('主题已应用；浏览器未允许保存到本地。'); }
const preferred=typeof matchMedia==='function'&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
setTheme(storage.read('theme',preferred),false);
$('#theme-toggle')?.addEventListener('click',()=>setTheme(root.dataset.theme==='dark'?'light':'dark'));
const palette=storage.read('palette','paper'); if(['paper','sage','ocean','plum','graphite'].includes(palette))root.dataset.palette=palette;
if($('#palette')) { $('#palette').value=root.dataset.palette; $('#palette').addEventListener('change',e=>{root.dataset.palette=e.target.value;if(!storage.write('palette',e.target.value))toast('配色已应用；此浏览器不提供持久化。');}); }
// compositionstart/end 与 isComposing/keyCode 三层保护，避免中文候选确认误触提交。
function imeGuard(el) { let composing=false; el.addEventListener('compositionstart',()=>composing=true); el.addEventListener('compositionend',()=>composing=false); return e=>composing||e?.isComposing||e?.keyCode===229; }
function autoSize(el,max=180) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight||48,max)+'px'; }
function openDialog(dialog, opener) { dialog._opener=opener||document.activeElement; if(!dialog.open)dialog.showModal(); }
$$('dialog').forEach(dialog=>{dialog.addEventListener('close',()=>dialog._opener?.focus());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});});
$$('[data-close-dialog]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
async function copyText(text) { try { if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);toast('已复制。');return;} } catch {} const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';document.body.append(ta);ta.select();let copied=false;try { copied=document.execCommand('copy'); } catch {}ta.remove();toast(copied?'已复制。':'浏览器未允许复制，请选中文字后手动复制。'); }

const launchInput=$('#launcher-input'),launchDialog=$('#launcher-dialog'),launchIme=imeGuard(launchInput);let selected=0,currentItems=[];const contextLabels={inbox:'我的收件盒',ideas:'设计灵感',project:'当前项目'};
let captures=storage.read('captures',[]);if(!Array.isArray(captures))captures=[];captures=captures.filter(x=>x&&typeof x.text==='string'&&typeof x.context==='string'&&Object.hasOwn(contextLabels,x.context)).slice(0,8).map(x=>({...x,text:x.text.slice(0,2000)}));
function renderCaptures(){$('#captures').replaceChildren();$('#capture-count').textContent=captures.length+' 条';if(!captures.length){const p=document.createElement('p');p.className='empty';p.textContent='这里会放下你刚刚捕捉的想法。';$('#captures').append(p);}captures.forEach((item,index)=>{const row=document.createElement('article');row.className='capture-entry';const body=document.createElement('div');const label=document.createElement('span');label.className='badge';label.textContent=contextLabels[item.context];const p=document.createElement('p');p.textContent=item.text;body.append(label,p);const remove=document.createElement('button');remove.className='btn quiet';remove.textContent='移除';remove.setAttribute('aria-label','移除记录 '+item.text.slice(0,20));remove.addEventListener('click',()=>{captures.splice(index,1);const ok=storage.write('captures',captures);renderCaptures();$('#open-launcher').focus();toast(ok?'记录已移除。':'本页记录已移除；存储不可用。');});row.append(body,remove);$('#captures').append(row);});}
function capture(){if(launchIme())return;const text=launchInput.value.trim();if(!text)return;captures.unshift({text:text.slice(0,2000),context:$('#capture-context').value});captures=captures.slice(0,8);const ok=storage.write('captures',captures);renderCaptures();launchInput.value='';renderCommands();launchDialog.close();toast(ok?'已记下，保留最近 8 条。':'已在本页记下；浏览器未允许持久保存。');}
const commands=[{key:'note',label:'记下一个新想法',detail:'短记、待办，或一句尚未完成的话',symbol:'+',run:()=>{launchInput.value='';launchInput.placeholder='写下这个想法，再按 Enter…';renderCommands();launchInput.focus();}},{key:'theme',label:'切换明暗主题',detail:'让当前工作区换一种光线',symbol:'◐',run:()=>{setTheme(root.dataset.theme==='dark'?'light':'dark');launchDialog.close();}},{key:'context',label:'切换保存位置',detail:'收件盒、设计灵感、当前项目',symbol:'▱',run:()=>{$('#capture-context').focus();}},{key:'review',label:'查看刚刚记下的内容',detail:'回到当前工作区，继续整理',symbol:'≡',run:()=>{launchDialog.close();$('.capture-area').scrollIntoView({block:'center',behavior:'auto'});}}];
function renderCommands(){if(launchIme())return;const query=launchInput.value.trim();currentItems=commands.filter(c=>(c.label+c.detail).toLowerCase().includes(query.toLowerCase()));if(query)currentItems.unshift({key:'capture',label:'记录“'+query+'”',detail:'保存到'+contextLabels[$('#capture-context').value],symbol:'↗',run:capture});selected=0;$('#command-list').replaceChildren();currentItems.forEach((item,index)=>{const el=document.createElement('div');el.id='command-'+index;el.className='command-option';el.setAttribute('role','option');el.setAttribute('aria-selected',String(index===selected));const symbol=document.createElement('span');symbol.className='command-symbol';symbol.textContent=item.symbol;symbol.setAttribute('aria-hidden','true');const copy=document.createElement('span');copy.className='command-copy';const strong=document.createElement('strong');strong.textContent=item.label;const small=document.createElement('span');small.textContent=item.detail;copy.append(strong,small);const hint=document.createElement('kbd');hint.textContent='↵';hint.setAttribute('aria-hidden','true');el.append(symbol,copy,hint);el.addEventListener('click',()=>{if(!launchIme())item.run();});el.addEventListener('pointermove',()=>selectCommand(index));$('#command-list').append(el);});$('#capture-submit').disabled=!query||launchIme();$('#command-heading').textContent=query?'MATCHING ACTIONS':'QUICK ACTIONS';$('#command-status').textContent=currentItems.length+' 个可用操作';selectCommand(0);}
function selectCommand(index){selected=Math.max(0,Math.min(index,currentItems.length-1));$$('.command-option').forEach((el,i)=>el.setAttribute('aria-selected',String(i===selected)));if(currentItems.length)launchInput.setAttribute('aria-activedescendant','command-'+selected);else launchInput.removeAttribute('aria-activedescendant');}
function openLauncher(){openDialog(launchDialog,$('#open-launcher'));launchInput.placeholder='搜索命令，或者写下一个想法…';renderCommands();launchInput.focus();}
$('#open-launcher').addEventListener('click',openLauncher);launchInput.addEventListener('input',renderCommands);launchInput.addEventListener('compositionstart',()=>$('#capture-submit').disabled=true);launchInput.addEventListener('compositionend',renderCommands);$('#capture-context').addEventListener('change',renderCommands);
launchInput.addEventListener('keydown',e=>{if(launchIme(e))return;if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();selectCommand(e.key==='Home'?0:e.key==='End'?currentItems.length-1:(selected+(e.key==='ArrowDown'?1:-1)+currentItems.length)%currentItems.length);$('#command-'+selected)?.scrollIntoView({block:'nearest'});}if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();currentItems[selected]?.run();}});
$('#launcher-form').addEventListener('submit',e=>{e.preventDefault();capture();});launchDialog.addEventListener('cancel',e=>{if(launchIme())e.preventDefault();});
document.addEventListener('keydown',e=>{if(launchIme(e))return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(launchDialog.open)launchDialog.close();else openLauncher();}});
renderCaptures();renderCommands();openLauncher();

</script></body></html>
